    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            
            // Main toggle
            document.getElementById('theme-icon-light').style.display = isDark ? 'block' : 'none';
            document.getElementById('theme-icon-dark').style.display = isDark ? 'none' : 'block';
            
            // Chat toggle (if it exists)
            const lightChat = document.getElementById('theme-icon-light-chat');
            const darkChat = document.getElementById('theme-icon-dark-chat');
            if(lightChat && darkChat) {
                lightChat.style.display = isDark ? 'block' : 'none';
                darkChat.style.display = isDark ? 'none' : 'block';
            }
            
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            toggleTheme();
        }

        let html5QrCode = null;
        let isScanning = false;
        let hasScanned = false;
        // This flag blocks peer init *while scanning* to prevent race conditions
        let ALLOW_PEER_INIT = true;
        // This flag prevents reload loops on disconnect
        let IS_RELOADING = false; 

        window.APP_PEER = null;
        window.APP_CONNECTION = null;

        function openScanner() {
            // ADDED GUARD: If scanner modal is already active or we are scanning, do nothing.
            if (isScanning || document.getElementById('scanner-modal').classList.contains('active')) {
                console.log('⚠ openScanner called but scanner is already active. Ignoring.');
                return;
            }
            console.log('📷 Opening scanner...');
            hasScanned = false;
            // Block peer auto-init *before* starting scanner
            ALLOW_PEER_INIT = false; 
            console.log('🚫 BLOCKED peer auto-init');
            document.getElementById('scanner-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
            startScanner();
        }

        function closeScanner() {
            // ADDED GUARD: Don't do anything if already closing
            if (!document.getElementById('scanner-modal').classList.contains('active')) {
                console.log('⚠ closeScanner called but modal is already closed.');
                return;
            }
            console.log('❌ Closing scanner...');
            document.getElementById('scanner-modal').classList.remove('active');
            document.body.style.overflow = '';
            stopScanner(); // This is now the only place that calls stopScanner after a scan
            // Re-allow peer init *only if* no scan was successful (and we are not reloading)
            if (!hasScanned && !IS_RELOADING) {
                ALLOW_PEER_INIT = true;
                console.log('✅ RE-ENABLED peer auto-init');
            }
        }

        function startScanner() {
            if (html5QrCode || isScanning) {
                console.log('⚠ Scanner already running');
                return;
            }
            isScanning = true;
            console.log('🎥 Starting camera...');

            html5QrCode = new Html5Qrcode("qr-reader");
            
            const config = {
                fps: 30,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    let minDimension = Math.min(viewfinderWidth, viewfinderHeight);
                    let qrboxSize = Math.floor(minDimension * 0.8);
                    return { width: qrboxSize, height: qrboxSize };
                },
                aspectRatio: 1.0,
                disableFlip: false
            };
            
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    if (hasScanned) {
                        console.log('⚠ Already processed, ignoring...');
                        return;
                    }
                    hasScanned = true;
                    // ALLOW_PEER_INIT remains false, which is correct
                    
                    console.log('✓✓✓ QR SCANNED:', decodedText);
                    console.log('🔍 Type:', typeof decodedText);
                    console.log('🔍 Length:', decodedText.length);
                    
                    if (navigator.vibrate) {
                        navigator.vibrate(200);
                    }
                    
                    // --- MODIFIED LOGIC ---
                    // Use setTimeout to break out of the scanner's execution context
                    // and prevent any race conditions.
                    setTimeout(() => {
                        // 1. Process the QR code first. This will set the IS_RELOADING flag.
                        console.log('→ Calling processQRCode NOW (from timeout)...');
                        processQRCode(decodedText);

                        // 2. Then, close the scanner modal. closeScanner() will handle stopping the camera.
                        console.log('→ Calling closeScanner NOW (from timeout)...');
                        closeScanner();
                    }, 0); // 0ms timeout executes after current stack.
                    // --- END MODIFIED LOGIC ---
                },
                (errorMessage) => {
                    // Silent
                }
            ).catch((err) => {
                console.error('❌ Scanner error:', err);
                isScanning = false;
                // Allow peer init to recover if camera fails
                ALLOW_PEER_INIT = true; 
                alert('Camera error: ' + err.name);
                closeScanner();
            });
        }

        /**
         * UPDATED: This function now sets the URL hash and reloads the page.
         */
        function processQRCode(decodedText) {
            // ADDED GUARD: Prevent multiple reloads
            if (IS_RELOADING) {
                console.log('⚠ Already processing QR and reloading. Ignoring.');
                return;
            }
            IS_RELOADING = true; // Set flag immediately

            console.log('=== PROCESSING QR CODE ===');
            console.log('URL:', decodedText);
            
            try {
                const url = new URL(decodedText);
                console.log('✓ Valid URL');
                console.log('Hash:', url.hash);
                
                const scannedPeerId = url.hash.substring(1);
                console.log('🎯 Extracted Peer ID:', scannedPeerId);
                console.log('🎯 Length:', scannedPeerId.length);
                
                if (!scannedPeerId || scannedPeerId.trim() === '') {
                    console.error('❌ Empty peer ID!');
                    alert('QR code has no peer ID');
                    hasScanned = false; // Allow re-scan
                    ALLOW_PEER_INIT = true; // Allow peer init to recover
                    return;
                }
                
                console.log('✓ Peer ID is valid');
                
                // --- NEW LOGIC ---
                // Set the hash to the scanned ID and reload.
                // The app will re-initialize in client mode.
                console.log('🔄 Setting hash and reloading to switch to CLIENT mode...');
                window.location.hash = scannedPeerId;
                window.location.reload();

            } catch (e) {
                console.error('❌❌❌ QR parse FAILED:', e);
                console.error('Error:', e.message);
                alert('Invalid QR code: ' + e.message);
                hasScanned = false; // Allow re-scan
                ALLOW_PEER_INIT = true; // Allow peer init to recover
                IS_RELOADING = false; // RESET FLAG on error
            }
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                console.log('🛑 Stopping scanner...');
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                    isScanning = false;
                    console.log('✓ Scanner stopped');
                }).catch((err) => {
                    console.error('Stop error:', err);
                    html5QrCode = null;
                    isScanning = false;
                });
            }
        }

        function showConnectionAnimation() {
            const overlay = document.getElementById('connection-overlay');
            overlay.classList.add('active');
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 2000);
        }
        
        function showSidebar() {
            document.body.classList.remove('connected-mobile');
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 App initialized');
            
            const statusEl = document.getElementById('status');
            const qrCodeContainer = document.getElementById('qr-code-container');
            const qrEl = document.getElementById('qrcode');
            const scanInstructions = document.getElementById('scan-instructions');
            const fileInput = document.getElementById('file-input');
            const transferStatusEl = document.getElementById('transfer-status');
            const shareButtonsContainer = document.getElementById('share-buttons-container');

            const nativeShareButton = document.getElementById('native-share-button');
            const copyLinkButton = document.getElementById('copy-link-button');
            const downloadQrButton = document.getElementById('download-qr-button');
            
            const transferListContainer = document.getElementById('transfer-list-container');
            const progressBarTemplate = document.getElementById('progress-bar-template');

            const chatMain = document.getElementById('chat-main');
            const chatTemplate = document.getElementById('chat-template');
            const chatPlaceholderTemplate = document.getElementById('chat-placeholder-template');

            const CHUNK_SIZE = 64 * 1024;
            const CHAT_CHUNK_SIZE = 1 * 1024 * 1024; // 1MB chunks for chat images
            const MAX_CHAT_MESSAGES = 1000; // Total messages to keep
            const MAX_CHAT_IMAGES = 6;
            const MAX_IMAGE_SIZE_TOTAL = 10 * 1024 * 1024; // 10MB

            let peer = null;
            let currentConnection = null;
            let myId = '';
            let connectUrl = '';
            let isHost = false; // This will be set by initializePeer
            let connectionRetryCount = 0;
            const MAX_RETRY = 3;
            
            let fileQueue = []; // Queue for sending files
            let isSending = false;
            let activeSend = null; // Will store the active fileJob
            let activeReader = null; // Store reference to the active file reader
            
            let receivingFiles = new Map(); // Map to store receiving file metadata
            
            let hasActiveTransfer = false;
            let heartbeatInterval = null;
            
            // --- CHAT STATE ---
            let chatMessages = [];
            let chatImages = [];
            let isTyping = false;
            let typingTimeout = null;
            let peerIsTyping = false;
            
            // --- READ RECEIPT STATE ---
            let unreadMessages = new Set();
            let sentMessages = new Map(); // { id: { element: <DOM>, status: 'sent' } }
            
            // --- CHAT IMAGE CHUNKING STATE ---
            let chatImagesReceiving = new Map();
            let activeChatImageSend = null;
            let activeChatImageReader = null;

            window.addEventListener('beforeunload', (event) => {
                if (isSending || receivingFiles.size > 0) {
                    const warningText = 'Transfer active!';
                    event.preventDefault();
                    event.returnValue = warningText;
                    return warningText;
                }
            });

            // This function is no longer needed, but we keep it in case
            // any other part of the code relies on it.
            function clearHashFromUrl() {
                const uri = window.location.toString();
                if (uri.indexOf("#") > 0) {
                    const cleanUri = uri.substring(0, uri.indexOf("#"));
                    window.history.replaceState({}, document.title, cleanUri);
                }
            }

            function initializePeer() {
                if (!ALLOW_PEER_INIT) {
                    console.log('🚫 Peer init BLOCKED (scanner active)');
                    return;
                }
                
                console.log('🔧 Initializing peer...');
                
                statusEl.textContent = 'Initializing...';
                
                // Show placeholder in desktop
                if (window.innerWidth >= 768) {
                    chatMain.innerHTML = '';
                    chatMain.appendChild(chatPlaceholderTemplate.content.cloneNode(true));
                }
                
                try {
                    peer = new Peer({
                        config: {
                            iceServers: [
                                { urls: 'stun:stun.l.google.com:19302' },
                                { 
                                    urls: 'turn:openrelay.metered.ca:80',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                }
                            ],
                            sdpSemantics: 'unified-plan'
                        },
                        debug: 1
                    });
                    
                    window.APP_PEER = peer;
                    
                } catch (e) {
                    console.error('❌ Init error:', e);
                    statusEl.textContent = '❌ Error';
                    return;
                }

                peer.on('open', (id) => {
                    myId = id;
                    console.log('✓ Peer ID:', id);
                    const targetId = window.location.hash.substring(1);

                    if (targetId) {
                        // --- CLIENT MODE ---
                        console.log('→ CLIENT MODE');
                        isHost = false;
                        statusEl.textContent = '🔗 Connecting...';
                        qrCodeContainer.style.display = 'none'; // Hide QR
                        shareButtonsContainer.style.display = 'none'; // Hide buttons
                        scanInstructions.style.display = 'none';
                        attemptConnection(targetId);
                    } else {
                        // --- HOST MODE ---
                        console.log('→ HOST MODE');
                        isHost = true;
                        qrCodeContainer.style.display = 'block';
                        scanInstructions.style.display = 'none';
                        
                        statusEl.textContent = 'Generating QR...';
                        
                        connectUrl = `${window.location.origin}${window.location.pathname}#${myId}`;
                        qrEl.innerHTML = '';
                        
                        new QRCode(qrEl, {
                            text: connectUrl,
                            width: 256,
                            height: 256,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                        
                        shareButtonsContainer.style.display = 'flex';
                        setTimeout(setupShareButton, 100);
                        statusEl.textContent = '✅ Ready';
                    }
                });

                peer.on('connection', (conn) => {
                    console.log('📡 Incoming connection');
                    if (currentConnection) {
                        console.log('⚠ Already connected, rejecting new connection.');
                        conn.close();
                        return;
                    }
                    
                    statusEl.textContent = '📡 Incoming...';
                    
                    if (conn.open) {
                        setupConnection(conn);
                    } else {
                        conn.on('open', () => setupConnection(conn));
                    }
                });

                peer.on('error', (err) => {
                    console.error('❌ Peer error:', err.type);
                    if (err.type === 'peer-unavailable') {
                        if (!isHost && connectionRetryCount < MAX_RETRY) {
                            connectionRetryCount++;
                            statusEl.textContent = `🔄 Retry ${connectionRetryCount}`;
                            setTimeout(() => {
                                const targetId = window.location.hash.substring(1);
                                if (targetId) attemptConnection(targetId);
                            }, 2000);
                        } else if (!isHost) {
                            statusEl.textContent = '❌ Peer not found';
                            showSwitchButton(); // Show button to go back to host mode
                        }
                    } else if (err.type === 'network') {
                        statusEl.textContent = '❌ Network Error. Retrying...';
                        setTimeout(initializePeer, 3000); // Retry init
                    }
                });
            }

            /**
             * UPDATED: This button now just reloads the page with no hash.
             */
            function showSwitchButton() {
                if (document.getElementById('switch-mode-btn')) return;
                
                const btn = document.createElement('button');
                btn.id = 'switch-mode-btn';
                btn.textContent = '🔄 Go to Host Mode';
                btn.className = 'switch-mode-button';
                btn.onclick = () => {
                    btn.remove();
                    // --- NEW LOGIC ---
                    // Just clear hash and reload
                    window.location.hash = '';
                    window.location.reload();
                    // --- END NEW LOGIC ---
                };
                document.querySelector('.transfer-area').appendChild(btn);
            }

            function attemptConnection(targetId) {
                console.log('→ Attempting connection to:', targetId);
                let connectionFailed = false;
                let connectionTimer = null;
                
                const handleFailure = (message) => {
                    if (connectionFailed) return;
                    connectionFailed = true;
                    if (connectionTimer) clearTimeout(connectionTimer);
                    console.error('❌ Connection failed:', message);
                    
                    if (connectionRetryCount < MAX_RETRY) {
                        connectionRetryCount++;
                        statusEl.textContent = `🔄 Retry ${connectionRetryCount}`;
                        setTimeout(() => attemptConnection(targetId), 2000);
                    } else {
                        statusEl.textContent = '❌ Failed to connect';
                        showSwitchButton(); // Show button to go back
                    }
                };

                try {
                    connectionTimer = setTimeout(() => handleFailure('Timeout'), 20000);
                    
                    const conn = peer.connect(targetId, { 
                        reliable: true,
                        serialization: 'binary'
                    });

                    conn.on('open', () => {
                        console.log('✓✓✓ CONNECTION OPENED!');
                        clearTimeout(connectionTimer);
                        if (!connectionFailed) {
                            connectionRetryCount = 0;
                            setupConnection(conn);
                        }
                    });

                    conn.on('error', (err) => {
                        console.error('❌ Connection error:', err);
                        handleFailure('Error');
                    });
                    
                    conn.on('close', () => {
                        console.log('⚠ Connection closed early');
                        if (!currentConnection) handleFailure('Closed');
                    });
                } catch (e) {
                    console.error('❌ Connect exception:', e);
                    handleFailure('Failed');
                }
            }
            
            function setupChatUI() {
                // Load chat template
                chatMain.innerHTML = '';
                chatMain.appendChild(chatTemplate.content.cloneNode(true));
                
                // Re-bind chat UI elements
                const chatMessagesEl = document.getElementById('chat-messages');
                const chatInput = document.getElementById('chat-message-input');
                const sendButton = document.getElementById('chat-send-button');
                const imageButton = document.getElementById('image-upload-button');
                const imageInput = document.getElementById('image-upload-input');
                
                // Re-apply theme to new chat UI
                if(localStorage.getItem('theme') === 'dark') {
                    const lightChat = document.getElementById('theme-icon-light-chat');
                    const darkChat = document.getElementById('theme-icon-dark-chat');
                    if(lightChat && darkChat) {
                        lightChat.style.display = 'block';
                        darkChat.style.display = 'none';
                    }
                }

                // Send message on Enter or Button click
                const sendMessage = () => {
                    const message = chatInput.value.trim();
                    if (message) {
                        sendChatMessage({ type: 'text', content: message });
                        chatInput.value = '';
                        stopTyping();
                    }
                };
                
                chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        sendMessage();
                    } else {
                        startTyping();
                    }
                });
                
                sendButton.addEventListener('click', sendMessage);
                
                // Image upload
                imageButton.addEventListener('click', () => imageInput.click());
                imageInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        sendChatImage(file);
                    }
                    e.target.value = null; // Reset input
                });
                
                // Add intersection observer for read receipts
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const messageId = entry.target.dataset.messageId;
                            if (unreadMessages.has(messageId)) {
                                console.log('Message seen:', messageId);
                                sendData({ type: 'chat', subtype: 'read', id: messageId });
                                unreadMessages.delete(messageId);
                                observer.unobserve(entry.target);
                            }
                        }
                    });
                }, { threshold: 0.8 });
                
                chatMessagesEl.observer = observer;
            }

            function setupConnection(conn) {
                console.log('✓ Setup connection');
                currentConnection = conn;
                window.APP_CONNECTION = conn;
                showConnectionAnimation();
                
                statusEl.textContent = '🔐 Connected!';
                fileInput.disabled = false;
                transferStatusEl.textContent = '✅ Ready';
                
                // --- NEW UI LOGIC ---
                // 1. Setup Chat UI
                setupChatUI();
                
                // 2. Add "connected" class to body
                if (window.innerWidth < 768) {
                    document.body.classList.add('connected-mobile');
                } else {
                    document.body.classList.add('connected-desktop');
                }
                
                // Hide QR container and show "Connected" status
                qrCodeContainer.style.display = 'none';
                shareButtonsContainer.style.display = 'none';
                scanInstructions.style.display = 'block';
                
                const switchBtn = document.getElementById('switch-mode-btn');
                if (switchBtn) switchBtn.remove();
                
                if (isHost) startHeartbeat();
                
                // Send a 'ready' signal to the other peer
                setTimeout(() => {
                    if (currentConnection && currentConnection.open) {
                        try {
                            currentConnection.send({ type: 'ready' });
                        } catch(e) {
                            console.error("Failed to send ready signal", e);
                        }
                    }
                }, 100);

                conn.on('data', (data) => {
                    // --- GENERIC DATA HANDLING ---
                    if (data.type === 'ready') {
                        statusEl.textContent = '✅ Ready!';
                        return;
                    }
                    
                    if (data.type === 'heartbeat-ping') {
                        conn.send({ type: 'heartbeat-pong' });
                        return;
                    }
                    
                    if (data.type === 'heartbeat-pong') return;
                    
                    // --- CHAT DATA ---
                    if (data.type === 'chat') {
                        handleChatData(data);
                        return;
                    }

                    // --- FILE TRANSFER LOGIC ---
                    if (data.type === 'metadata') {
                        const fileId = data.fileId;
                        receivingFiles.set(fileId, {
                            id: fileId,
                            ...data,
                            chunks: [],
                            receivedBytes: 0,
                            startTime: Date.now()
                        });
                        
                        const fileData = receivingFiles.get(fileId);
                        
                        const progressEl = createProgressBar(fileId, fileData.name, fileData.size, 'receive');
                        transferListContainer.appendChild(progressEl);
                        
                        // Add cancel listener
                        progressEl.querySelector('.cancel-transfer-btn').onclick = () => {
                            cancelTransfer(fileId);
                        };

                    } else if (data.type === 'end') {
                        const fileId = data.fileId;
                        const fileData = receivingFiles.get(fileId);

                        if (fileData) {
                            const fileBlob = new Blob(fileData.chunks, { type: fileData.fileType });
                            const downloadUrl = URL.createObjectURL(fileBlob);
                            const a = document.createElement('a');
                            a.href = downloadUrl;
                            a.download = fileData.name;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            setTimeout(() => URL.revokeObjectURL(downloadUrl), 100);
                            
                            document.getElementById(`transfer-${fileId}`)?.remove();
                            receivingFiles.delete(fileId);
                        }

                    } else if (data.type === 'cancel') {
                        const fileId = data.fileId;
                        console.log(`Received cancel for: ${fileId}`);

                        // 1. Is it our active send?
                        if (activeSend && activeSend.id === fileId) {
                            console.log('Cancelling active send (peer request)');
                            activeSend.status = 'cancelled';
                            if (activeReader) {
                                activeReader.abort();
                            }
                        }
                        // 2. Is it in our pending send queue?
                        else if (fileQueue.some(job => job.id === fileId)) {
                            console.log('Cancelling pending send (peer request)');
                            fileQueue = fileQueue.filter(job => job.id !== fileId);
                            document.getElementById(`transfer-${fileId}`)?.remove();
                            updateTransferStatus();
                        }
                        // 3. Are we receiving it?
                        else if (receivingFiles.has(fileId)) {
                            console.log('Cancelling active receive (peer request)');
                            document.getElementById(`transfer-${fileId}`)?.remove();
                            receivingFiles.delete(fileId);
                        }
                        // 4. Is it a chat image we are sending?
                        else if (activeChatImageSend && activeChatImageSend.id === fileId) {
                            console.log('Cancelling active chat image send (peer request)');
                            activeChatImageSend.status = 'cancelled';
                            if (activeChatImageReader) {
                                activeChatImageReader.abort();
                            }
                        }
                        // 5. Is it a chat image we are receiving?
                        else if (chatImagesReceiving.has(fileId)) {
                            console.log('Cancelling active chat image receive (peer request)');
                            const imgData = chatImagesReceiving.get(fileId);
                            if (imgData && imgData.bubble) {
                                imgData.bubble.innerHTML = '<i>Message cancelled by peer.</i>';
                            }
                            chatImagesReceiving.delete(fileId);
                        }

                    } else { // This is a file chunk (ArrayBuffer)
                        const fileId = data.fileId;
                        const fileData = receivingFiles.get(fileId);
                        
                        if (fileData) {
                            fileData.chunks.push(data.chunk);
                            fileData.receivedBytes += data.chunk.byteLength;
                            
                            const percent = Math.round((fileData.receivedBytes / fileData.size) * 100);
                            updateProgressBar(fileId, percent, fileData.receivedBytes, fileData.size, fileData.startTime);
                        }
                    }
                });

                conn.on('close', () => handleDisconnect('Closed'));
                conn.on('error', (err) => {
                    console.error("Connection error:", err);
                    handleDisconnect('Error');
                });
                
                if (fileQueue.length > 0 && !isSending) {
                    setTimeout(() => sendNextFileFromQueue(), 500);
                }
            }
            
            // --- CHAT LOGIC ---
            
            function handleChatData(data) {
                const chatMessagesEl = document.getElementById('chat-messages');
                const peerStatusEl = document.getElementById('peer-status');

                switch(data.subtype) {
                    case 'text':
                        displayChatMessage(data, 'receiver');
                        break;
                    
                    // --- NEW CHAT IMAGE CHUNKING ---
                    case 'image_start':
                        // Store placeholder for incoming chunks
                        const bubble = displayChatMessage(data, 'receiver'); // Display placeholder
                        chatImagesReceiving.set(data.id, {
                            bubble: bubble,
                            chunks: [],
                            fileType: data.fileType,
                            name: data.name
                        });
                        break;
                    case 'image_chunk':
                        const imgData = chatImagesReceiving.get(data.id);
                        if (imgData) {
                            imgData.chunks.push(data.chunk);
                        }
                        break;
                    case 'image_end':
                        const finishedImgData = chatImagesReceiving.get(data.id);
                        if (finishedImgData) {
                            const imgBlob = new Blob(finishedImgData.chunks, { type: finishedImgData.fileType });
                            const dataUrl = URL.createObjectURL(imgBlob);
                            
                            const imgEl = finishedImgData.bubble.querySelector('img');
                            if (imgEl) {
                                imgEl.src = dataUrl;
                                // No revoke needed for blob URLs
                            }
                            chatImagesReceiving.delete(data.id);
                        }
                        break;
                    // --- END CHAT IMAGE CHUNKING ---

                    case 'image_download':
                        const el = document.querySelector(`.message-bubble[data-message-id="${data.id}"]`);
                        if(el) {
                            let statusEl = el.querySelector('.image-download-status');
                            if (!statusEl) {
                                statusEl = document.createElement('div');
                                statusEl.className = 'image-download-status';
                                el.appendChild(statusEl);
                            }
                            statusEl.textContent = 'Downloaded by peer';
                        }
                        break;
                    case 'typing_start':
                        if (peerStatusEl) peerStatusEl.textContent = 'Typing...';
                        peerIsTyping = true;
                        break;
                    case 'typing_stop':
                        if (peerStatusEl && peerIsTyping) peerStatusEl.textContent = 'Online';
                        peerIsTyping = false;
                        break;
                    case 'read':
                        const msg = sentMessages.get(data.id);
                        if (msg && msg.status === 'sent') {
                            msg.status = 'read';
                            const tick = msg.element.querySelector('.read-receipt');
                            if (tick) {
                                tick.textContent = '✓✓';
                                tick.classList.remove('sent');
                                tick.classList.add('read');
                            }
                        }
                        break;
                }
            }
            
            function sendData(data) {
                if (currentConnection && currentConnection.open) {
                    try {
                        currentConnection.send(data);
                    } catch (e) {
                        console.error('Failed to send data', e);
                        handleDisconnect('Send error');
                    }
                }
            }
            
            function sendChatMessage(data) {
                const id = `msg_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                data.id = id;
                data.timestamp = Date.now();
                displayChatMessage(data, 'sender');
                sendData({ type: 'chat', ...data });
            }
            
            // --- Image Sending Logic (with Chunks) ---
            function sendChatImage(file) {
                if (chatImages.length >= MAX_CHAT_IMAGES) {
                    alert('You can only send 6 images. Old images will be removed.');
                    return;
                }
                
                const totalSize = chatImages.reduce((acc, img) => acc + img.size, 0) + file.size;
                if (totalSize > MAX_IMAGE_SIZE_TOTAL) {
                    alert(`Total image size exceeds 10MB limit.`);
                    return;
                }
                
                if (activeChatImageSend) {
                    alert('Please wait for the previous image to finish sending.');
                    return;
                }
                
                const id = `img_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                const job = {
                    id: id,
                    file: file,
                    status: 'sending'
                };
                activeChatImageSend = job;
                
                const localUrl = URL.createObjectURL(file);
                
                // 1. Display locally
                const imgData = { 
                    id, 
                    timestamp: Date.now(), 
                    type: 'image_start', 
                    name: file.name, 
                    fileType: file.type,
                    content: localUrl // Local blob URL
                };
                displayChatMessage(imgData, 'sender');
                
                // 2. Send metadata
                sendData({ type: 'chat', subtype: 'image_start', id: id, timestamp: imgData.timestamp, name: file.name, fileType: file.type });

                // 3. Send image chunks
                let offset = 0;
                const reader = new FileReader();
                activeChatImageReader = reader;
                
                reader.onload = (e) => {
                    if (activeChatImageSend !== job) return; // Cancelled
                    
                    try {
                        sendData({ type: 'chat', subtype: 'image_chunk', id: id, chunk: e.target.result });
                        offset += e.target.result.byteLength;
                        
                        if (offset < file.size) {
                            readSlice(offset);
                        } else {
                            sendData({ type: 'chat', subtype: 'image_end', id: id });
                            activeChatImageSend = null;
                            activeChatImageReader = null;
                        }
                    } catch (err) {
                        console.error("Chat image send error:", err);
                        activeChatImageSend = null;
                        activeChatImageReader = null;
                    }
                };
                
                reader.onerror = (e) => {
                    if (e.name === 'AbortError') {
                        console.log(`Chat image send aborted: ${id}`);
                    } else {
                        console.error(`Chat image read error: ${id}`, e);
                    }
                    activeChatImageSend = null;
                    activeChatImageReader = null;
                };

                function readSlice(o) {
                    if (activeChatImageSend !== job) return; // Cancelled
                    const slice = file.slice(o, o + CHAT_CHUNK_SIZE);
                    reader.readAsArrayBuffer(slice);
                }
                
                readSlice(0);
            }
            
            function displayChatMessage(data, senderType) {
                const chatMessagesEl = document.getElementById('chat-messages');
                if (!chatMessagesEl) return;
                
                const wasAtBottom = chatMessagesEl.scrollTop + chatMessagesEl.clientHeight + 50 >= chatMessagesEl.scrollHeight;

                const bubble = document.createElement('div');
                bubble.className = `message-bubble ${senderType}`;
                bubble.dataset.messageId = data.id;
                
                let messageContent = '';
                
                if (data.type === 'text' || data.subtype === 'text') {
                    messageContent = data.content.replace(/\n/g, '<br>');
                    bubble.innerHTML = `<div class="message-text">${messageContent}</div>`;
                }
                else if (data.type === 'image_start' || data.subtype === 'image_start') {
                    // This is the metadata for an image
                    const imgSrc = data.content ? data.content : 'https://placehold.co/250x250/eee/aaa?text=Loading...';
                    bubble.innerHTML = `
                        <img src="${imgSrc}" class="message-image" alt="image" data-id="${data.id}" onclick="downloadImage(this, '${data.name}')">
                    `;
                    chatImages.push({ id: data.id, size: data.size || 0 });
                }
                
                // Add Meta (Timestamp + Ticks)
                const meta = document.createElement('div');
                meta.className = 'message-meta';
                
                const timestamp = document.createElement('span');
                timestamp.textContent = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                meta.appendChild(timestamp);

                if (senderType === 'sender') {
                    const tick = document.createElement('span');
                    tick.className = 'read-receipt sent';
                    tick.textContent = '✓';
                    meta.appendChild(tick);
                    
                    sentMessages.set(data.id, { element: bubble, status: 'sent' });
                } else {
                    // This is a received message, add to unread set
                    unreadMessages.add(data.id);
                    chatMessagesEl.observer.observe(bubble);
                }
                
                bubble.appendChild(meta);
                chatMessagesEl.appendChild(bubble);

                // Auto-scroll
                if (wasAtBottom) {
                    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
                }

                // Enforce limits
                chatMessages.push(bubble);
                if (chatMessages.length > MAX_CHAT_MESSAGES) {
                    const oldMsg = chatMessages.shift();
                    chatMessagesEl.observer.unobserve(oldMsg);
                    oldMsg.remove();
                }
                
                if (chatImages.length > MAX_CHAT_IMAGES) {
                    const oldImgData = chatImages.shift();
                    const oldImgEl = chatMessagesEl.querySelector(`[data-message-id="${oldImgData.id}"]`);
                    if (oldImgEl) {
                        chatMessagesEl.observer.unobserve(oldImgEl);
                        oldImgEl.remove();
                        // Also remove from main chatMessages array
                        chatMessages = chatMessages.filter(msg => msg !== oldImgEl);
                    }
                }
                
                return bubble; // Return the created bubble
            }
            
            // Function to download image and notify sender
            window.downloadImage = (imgElement, fileName) => {
                const messageId = imgElement.dataset.id;
                
                // 1. Create a link to download
                const a = document.createElement('a');
                a.href = imgElement.src;
                a.download = fileName || 'image.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                // 2. Notify sender
                sendData({ type: 'chat', subtype: 'image_download', id: messageId });
            }

            // --- Typing Indicators ---
            function startTyping() {
                if (!isTyping) {
                    isTyping = true;
                    sendData({ type: 'chat', subtype: 'typing_start' });
                }
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(stopTyping, 2000);
            }
            
            function stopTyping() {
                if (isTyping) {
                    isTyping = false;
                    sendData({ type: 'chat', subtype: 'typing_stop' });
                }
                clearTimeout(typingTimeout);
            }
            
            
            // --- HEARTBEAT & DISCONNECT ---
            
            function startHeartbeat() {
                stopHeartbeat();
                heartbeatInterval = setInterval(() => {
                    if (currentConnection && currentConnection.open) {
                        try {
                            currentConnection.send({ type: 'heartbeat-ping' });
                        } catch (e) {}
                    }
                }, 5000);
            }

            function stopHeartbeat() {
                if (heartbeatInterval) {
                    clearInterval(heartbeatInterval);
                    heartbeatInterval = null;
                }
            }
            
            /**
             * UPDATED: This function now clears the hash and reloads the page.
             */
            function handleDisconnect(message) {
                console.log('⚠ Disconnect:', message);
                stopHeartbeat();
                
                // Set a flag to prevent multiple reloads
                if (IS_RELOADING) return;
                IS_RELOADING = true;

                statusEl.textContent = '⚠️ Disconnected... Reloading...';
                
                if (currentConnection) {
                    try { currentConnection.close(); } catch (e) {}
                    currentConnection = null;
                }
                if (peer && !peer.destroyed) {
                    try { peer.destroy(); } catch (e) {}
                    peer = null;
                }
                
                // --- NEW LOGIC ---
                // Disconnected. Clear the hash and reload.
                // The app will re-initialize in HOST mode.
                console.log('🔄 Reverting to host mode by reloading...');
                window.location.hash = '';
                window.location.reload();
                // --- END NEW LOGIC ---
            }
            
            // --- FILE SENDING LOGIC (QUEUE) ---

            fileInput.addEventListener('change', (event) => {
                for (const file of event.target.files) {
                    const fileId = `file_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    const fileJob = {
                        id: fileId,
                        file: file,
                        status: 'pending' // 'pending', 'sending', 'cancelled'
                    };
                    fileQueue.push(fileJob);
                    
                    // Create UI
                    const progressEl = createProgressBar(fileId, file.name, file.size, 'send');
                    transferListContainer.appendChild(progressEl);
                    
                    // Add cancel listener
                    progressEl.querySelector('.cancel-transfer-btn').onclick = () => {
                        cancelTransfer(fileId);
                    };
                }
                event.target.value = null; // Clear input
                updateTransferStatus();
                
                if (currentConnection && currentConnection.open && !isSending) {
                    sendNextFileFromQueue();
                }
            });
            
            function updateTransferStatus() {
                if (fileQueue.length > 0) {
                    transferStatusEl.textContent = `📁 ${fileQueue.length} queued`;
                } else if (!isSending) {
                    transferStatusEl.textContent = '✅ Ready';
                }
            }

            function sendNextFileFromQueue() {
                if (isSending) return; // Already sending
                
                const fileJob = fileQueue.find(job => job.status === 'pending');
                if (!fileJob) {
                    isSending = false;
                    hasActiveTransfer = false;
                    updateTransferStatus();
                    return;
                }
                
                if (!currentConnection || !currentConnection.open) return;
                
                isSending = true;
                hasActiveTransfer = true;
                fileJob.status = 'sending';
                activeSend = fileJob; // Set as active
                
                const file = fileJob.file;
                
                transferStatusEl.textContent = `📤 ${file.name}`;
                updateProgressBar(fileJob.id, 0, 0, file.size, Date.now(), 'sending');

                const startTime = Date.now();

                try {
                    currentConnection.send({
                        type: 'metadata',
                        fileId: fileJob.id,
                        name: file.name,
                        size: file.size,
                        fileType: file.type
                    });
                } catch (e) {
                    handleDisconnect('Send failed');
                    return;
                }

                let offset = 0;
                const reader = new FileReader();
                activeReader = reader; // Store reference

                reader.onload = (e) => {
                    // --- CANCEL FIX ---
                    if (activeSend !== fileJob) {
                        console.log('reader.onload fired for a cancelled/stale job. Ignoring.');
                        return;
                    }
                    // --- END CANCEL FIX ---
                    
                    if(!currentConnection || !currentConnection.open) {
                        isSending = false;
                        activeSend = null;
                        activeReader = null;
                        hasActiveTransfer = false;
                        fileJob.status = 'pending'; // Re-queue
                        console.error("Connection lost during sending");
                        return;
                    }
                
                    try {
                        currentConnection.send({ 
                            type: 'chunk', 
                            fileId: fileJob.id,
                            chunk: e.target.result 
                        }); // Send ArrayBuffer
                        offset += e.target.result.byteLength;
                        updateProgressBar(fileJob.id, Math.round((offset / file.size) * 100), offset, file.size, startTime, 'sending');

                        if (offset < file.size) {
                            readSlice(offset);
                        } else {
                            currentConnection.send({ type: 'end', fileId: fileJob.id });
                            document.getElementById(`transfer-${fileJob.id}`)?.remove();
                            // Remove from queue
                            fileQueue = fileQueue.filter(job => job.id !== fileJob.id);
                            
                            isSending = false;
                            activeSend = null;
                            activeReader = null; // Clear reader
                            sendNextFileFromQueue(); // Send next file
                        }
                    } catch (err) {
                        console.error("Send error:", err);
                    }
                };
                
                reader.onerror = (e) => {
                    // --- CANCEL FIX ---
                    // This is now the main path for cancellation cleanup
                    const wasAborted = e.target.error && e.target.error.name === 'AbortError';
                    if (wasAborted) {
                        console.log(`File read aborted for ${fileJob.id}.`);
                    } else {
                        console.error(`File read error for ${fileJob.id}:`, e.target.error);
                        transferStatusEl.textContent = '❌ File Read error';
                        document.getElementById(`transfer-${fileJob.id}`)?.remove();
                    }
                    
                    // General cleanup for any error/abort
                    isSending = false;
                    activeSend = null;
                    activeReader = null; // Clear reader
                    
                    // Remove from queue
                    fileQueue = fileQueue.filter(job => job.id !== fileJob.id);
                    
                    // Send next file
                    sendNextFileFromQueue(); 
                    // --- END CANCEL FIX ---
                };

                function readSlice(o) {
                    // --- CANCEL FIX ---
                    if (activeSend !== fileJob) {
                         console.log('readSlice called for a cancelled/stale job. Ignoring.');
                        return;
                    }
                    // --- END CANCEL FIX ---

                    const slice = file.slice(o, o + CHUNK_SIZE);
                    reader.readAsArrayBuffer(slice);
                }
                
                readSlice(0);
            }
            
            function cancelTransfer(fileId) {
                // Is it the active transfer?
                if (activeSend && activeSend.id === fileId) {
                    console.log(`Cancelling active transfer: ${fileId}`);
                    activeSend.status = 'cancelled'; // Flag for reader.onload/readSlice
                    
                    // --- NEW: Abort the reader ---
                    // This will trigger reader.onerror, which now handles cleanup.
                    if (activeReader) {
                        console.log('Aborting active file reader...');
                        activeReader.abort();
                    }
                    // --- END NEW ---
                    
                    // Remove UI
                    document.getElementById(`transfer-${fileId}`)?.remove();
                    
                    // Notify peer
                    sendData({ type: 'cancel', fileId: fileId });
                }
                // Is it in the pending queue?
                else if (fileQueue.some(job => job.id === fileId)) {
                    console.log(`Cancelling pending transfer: ${fileId}`);
                    fileQueue = fileQueue.filter(job => job.id !== fileId);
                    document.getElementById(`transfer-${fileId}`)?.remove();
                    updateTransferStatus();
                }
                // Are we receiving it?
                else if (receivingFiles.has(fileId)) {
                    console.log(`Cancelling active receive: ${fileId}`);
                    document.getElementById(`transfer-${fileId}`)?.remove();
                    receivingFiles.delete(fileId);
                    // Notify peer
                    sendData({ type: 'cancel', fileId: fileId });
                }
            }
            
            // --- UI HELPERS (Progress Bar) ---
            
            function createProgressBar(id, name, size, type) {
                const template = progressBarTemplate.content.cloneNode(true);
                const container = template.querySelector('.progress-container');
                container.id = `transfer-${id}`;
                
                container.querySelector('.file-name').textContent = name;
                
                const sizeEl = container.querySelector('.progress-size');
                sizeEl.textContent = `0 / ${formatBytes(size)}`;
                
                const etaEl = container.querySelector('.progress-eta');
                etaEl.textContent = type === 'send' ? 'ETA: --:--' : 'Receiving...';
                
                if (type === 'send') {
                    container.querySelector('.progress-bar').classList.add('pending');
                }
                
                return container;
            }
            
            function updateProgressBar(id, percent, sentBytes, totalBytes, startTime, status = 'sending') {
                const el = document.getElementById(`transfer-${id}`);
                if (!el) return;
                
                const bar = el.querySelector('.progress-bar');
                
                if (status === 'pending') {
                    bar.classList.add('pending');
                    bar.style.width = '100%';
                    el.querySelector('.progress-eta').textContent = 'Pending...';
                    return;
                }
                
                bar.classList.remove('pending');
                bar.style.width = `${percent}%`;
                el.querySelector('.progress-size').textContent = `${formatBytes(sentBytes)} / ${formatBytes(totalBytes)}`;

                const elapsedTime = (Date.now() - startTime) / 1000;
                if (elapsedTime > 0.5) {
                    const speed = sentBytes / elapsedTime;
                    const remainingBytes = totalBytes - sentBytes;
                    const remainingTime = remainingBytes / speed;
                    if (isFinite(remainingTime)) {
                        el.querySelector('.progress-eta').textContent = `ETA: ${formatTime(remainingTime)}`;
                    } else {
                        el.querySelector('.progress-eta').textContent = `ETA: --:--`;
                    }
                }
            }

            function formatBytes(bytes, decimals = 2) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
            }
            
            function formatTime(seconds) {
                if (seconds === Infinity || isNaN(seconds)) return '--:--';
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min}:${sec < 10 ? '0' : ''}${sec}`;
            }

            // --- SHARE/COPY/DOWNLOAD BUTTONS ---

            function setupShareButton() {
                const canvas = qrEl.querySelector('canvas');
                if (!canvas || typeof navigator.share === 'undefined') {
                    nativeShareButton.style.display = 'none';
                    copyLinkButton.style.display = 'inline-flex';
                    downloadQrButton.style.display = 'inline-flex';
                    return;
                }

                canvas.toBlob((blob) => {
                    if (!blob) {
                        nativeShareButton.style.display = 'none';
                        copyLinkButton.style.display = 'inline-flex';
                        downloadQrButton.style.display = 'inline-flex';
                        return;
                    }
                    
                    const file = new File([blob], 'qr-code.png', { type: 'image/png' });
                    const shareData = {
                        title: 'QR Send',
                        text: 'Scan to connect',
                        url: connectUrl,
                        files: [file]
                    };

                    if (navigator.canShare && navigator.canShare(shareData)) {
                        nativeShareButton.style.display = 'inline-flex';
                        copyLinkButton.style.display = 'none';
                        downloadQrButton.style.display = 'none';
                        nativeShareButton.onclick = async () => {
                            try {
                                await navigator.share(shareData);
                            } catch (err) {}
                        };
                    } else {
                        nativeShareButton.style.display = 'none';
                        copyLinkButton.style.display = 'inline-flex';
                        downloadQrButton.style.display = 'inline-flex';
                    }
                }, 'image/png');
            }

            function copyToClipboard(text, element) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    if(element) {
                        const originalText = element.textContent;
                        element.textContent = '✅ Copied!';
                        setTimeout(() => {
                            element.textContent = originalText;
                        }, 1500);
                    }
                } catch (err) {}
                document.body.removeChild(textarea);
            }
            
            function downloadQRCode() {
                try {
                    const canvas = qrEl.querySelector('canvas');
                    if (canvas) {
                        const dataUrl = canvas.toDataURL('image/png');
                        const a = document.createElement('a');
                        a.href = dataUrl;
                        a.download = 'qr-send.png';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    }
                } catch (e) {}
            }

            copyLinkButton.addEventListener('click', () => {
                if (connectUrl) copyToClipboard(connectUrl, copyLinkButton);
            });
            
            downloadQrButton.addEventListener('click', downloadQRCode);

            // Start the app
            initializePeer();
        });
    </script>
</body>
</html>
