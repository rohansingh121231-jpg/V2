 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Transfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 20px;
        }

        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 48px;
            margin-bottom: 40px;
            grid-column: 1 / -1;
        }

        h2 {
            color: #334155;
            font-size: 24px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 500;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
        }

        .status.warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .peer-id {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            margin-top: 15px;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e2e8f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #64748b;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #334155;
        }

        .modal p {
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal .progress-display {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal .progress-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            background: #e2e8f0 !important;
            color: #334155 !important;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 3000;
            min-width: 300px;
            display: none;
        }

        .notification.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }

        .notification.success {
            border-left: 4px solid var(--success-color);
        }

        .notification.error {
            border-left: 4px solid var(--error-color);
        }

        .notification.warning {
            border-left: 4px solid var(--warning-color);
        }
    </style>
</head>
<body>
    <h1>🚀 P2P File Transfer</h1>

    <div class="container">
        <!-- Connection Card -->
        <div class="card">
            <h2>🔗 Connection</h2>
            
            <div class="input-group">
                <label>Your Peer ID</label>
                <div class="peer-id" id="myPeerId">Connecting...</div>
            </div>

            <div class="input-group">
                <label>Remote Peer ID</label>
                <input type="text" id="remotePeerId" placeholder="Enter remote peer ID">
            </div>

            <button id="connectBtn" onclick="connectToPeer()">Connect to Peer</button>
            
            <div id="connectionStatus"></div>
        </div>

        <!-- Send File Card -->
        <div class="card">
            <h2>📤 Send File</h2>
            
            <div class="input-group">
                <label>Select File</label>
                <input type="file" id="fileInput" onchange="handleFileSelect(event)">
            </div>

            <button id="sendBtn" onclick="sendFile()" disabled>Send File</button>

            <div class="progress-container" id="sendProgress">
                <div class="progress-bar">
                    <div class="progress-fill" id="sendProgressFill">0%</div>
                </div>
                <div class="progress-info">
                    <span id="sendSpeed">0 KB/s</span>
                    <span id="sendData">0 MB / 0 MB</span>
                </div>
            </div>
        </div>

        <!-- Receive File Card -->
        <div class="card">
            <h2>📥 Receive File</h2>
            
            <div id="receiveStatus">Waiting for incoming files...</div>

            <div class="progress-container" id="receiveProgress">
                <div class="progress-bar">
                    <div class="progress-fill" id="receiveProgressFill">0%</div>
                </div>
                <div class="progress-info">
                    <span id="receiveSpeed">0 KB/s</span>
                    <span id="receiveData">0 MB / 0 MB</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Resume Modal -->
    <div class="modal-overlay" id="resumeModal">
        <div class="modal">
            <h3>⚠️ Transfer Interrupted</h3>
            <p id="resumeMessage">Your previous transfer was interrupted. Would you like to resume?</p>
            <div class="progress-display">
                <div style="font-size: 13px; color: #64748b; margin-bottom: 8px;">Completed</div>
                <div class="progress-value" id="resumeProgress">0%</div>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="cancelResume()">Cancel</button>
                <button onclick="acceptResume()">Resume</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
    <script>
        const CHUNK_SIZE = 16384; // 16KB
        const SERVER_URL = 'YOUR_SIGNALING_SERVER_URL'; // Replace with your server

        let socket;
        let peer;
        let conn;
        let selectedFile;
        
        // Transfer State with Resume Support
        let transferState = {
            fileId: null,
            fileName: null,
            fileSize: 0,
            fileType: null,
            direction: null, // 'send' or 'receive'
            sentBytes: 0,
            receivedBytes: 0,
            receivedChunks: new Map(),
            isTransferring: false,
            isPaused: false,
            lastChunkIndex: 0,
            totalChunks: 0,
            startTime: null,
            fileData: null
        };

        // Initialize Socket.IO
        function initSocket() {
            socket = io(SERVER_URL, {
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionAttempts: Infinity
            });

            socket.on('connect', () => {
                console.log('Connected to signaling server');
                showNotification('Connected to server', 'success');
                
                // Check for interrupted transfer
                if (transferState.isPaused && transferState.isTransferring) {
                    setTimeout(() => {
                        if (conn && conn.open) {
                            showResumeDialog();
                        }
                    }, 1000);
                }
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from signaling server');
                showNotification('Disconnected from server', 'error');
                
                // Pause transfer on disconnect
                if (transferState.isTransferring && !transferState.isPaused) {
                    pauseTransfer();
                }
            });

            socket.on('reconnect', () => {
                showNotification('Reconnected to server', 'success');
            });
        }

        // Initialize PeerJS
        function initPeer() {
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                console.log('My peer ID:', id);
                document.getElementById('myPeerId').textContent = id;
                showNotification('Peer initialized', 'success');
            });

            peer.on('connection', (connection) => {
                console.log('Incoming connection from:', connection.peer);
                setupConnection(connection);
            });

            peer.on('disconnected', () => {
                console.log('Peer disconnected');
                showNotification('Peer disconnected', 'warning');
                
                // Pause transfer
                if (transferState.isTransferring && !transferState.isPaused) {
                    pauseTransfer();
                }
                
                // Try to reconnect
                setTimeout(() => {
                    if (!peer.destroyed) {
                        peer.reconnect();
                    }
                }, 2000);
            });

            peer.on('error', (error) => {
                console.error('Peer error:', error);
                showNotification('Peer error: ' + error.type, 'error');
            });
        }

        // Connect to Remote Peer
        function connectToPeer() {
            const remotePeerId = document.getElementById('remotePeerId').value.trim();
            
            if (!remotePeerId) {
                showNotification('Please enter remote peer ID', 'error');
                return;
            }

            if (!peer || peer.destroyed) {
                showNotification('Peer not initialized', 'error');
                return;
            }

            conn = peer.connect(remotePeerId, {
                reliable: true,
                serialization: 'json'
            });

            setupConnection(conn);
        }

        // Setup Connection Handlers
        function setupConnection(connection) {
            conn = connection;

            conn.on('open', () => {
                console.log('Connection opened with:', conn.peer);
                document.getElementById('connectionStatus').innerHTML = 
                    '<div class="status success">✓ Connected to peer</div>';
                document.getElementById('sendBtn').disabled = false;
                showNotification('Connected to peer', 'success');
                
                // Load saved state and check for resume
                loadTransferState();
                if (transferState.isPaused && transferState.isTransferring) {
                    showResumeDialog();
                }
            });

            conn.on('data', (data) => {
                handleIncomingData(data);
            });

            conn.on('close', () => {
                console.log('Connection closed');
                document.getElementById('connectionStatus').innerHTML = 
                    '<div class="status error">✕ Connection closed</div>';
                document.getElementById('sendBtn').disabled = true;
                showNotification('Connection closed', 'warning');
                
                // Pause transfer
                if (transferState.isTransferring && !transferState.isPaused) {
                    pauseTransfer();
                }
            });

            conn.on('error', (error) => {
                console.error('Connection error:', error);
                showNotification('Connection error', 'error');
            });
        }

        // Handle Incoming Data
        function handleIncomingData(data) {
            switch (data.type) {
                case 'metadata':
                    handleMetadata(data);
                    break;
                    
                case 'chunk':
                    handleChunk(data);
                    break;
                    
                case 'complete':
                    handleTransferComplete();
                    break;
                    
                case 'request-resume':
                    handleResumeRequest();
                    break;
                    
                case 'resume-info':
                    handleResumeInfo(data);
                    break;
                    
                case 'resume-accepted':
                    continueTransfer(data.fromChunk);
                    break;
                    
                case 'cancel':
                    handleTransferCancelled();
                    break;
                    
                default:
                    console.log('Unknown message type:', data.type);
            }
        }

        // File Selection
        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                showNotification('File selected: ' + selectedFile.name, 'success');
            }
        }

        // Send File
        async function sendFile() {
            if (!selectedFile) {
                showNotification('Please select a file', 'error');
                return;
            }

            if (!conn || !conn.open) {
                showNotification('Not connected to peer', 'error');
                return;
            }

            // Initialize transfer state
            transferState = {
                fileId: generateFileId(),
                fileName: selectedFile.name,
                fileSize: selectedFile.size,
                fileType: selectedFile.type,
                direction: 'send',
                sentBytes: 0,
                receivedBytes: 0,
                receivedChunks: new Map(),
                isTransferring: true,
                isPaused: false,
                lastChunkIndex: 0,
                totalChunks: Math.ceil(selectedFile.size / CHUNK_SIZE),
                startTime: Date.now(),
                fileData: selectedFile
            };

            // Send metadata
            conn.send({
                type: 'metadata',
                fileId: transferState.fileId,
                fileName: transferState.fileName,
                fileSize: transferState.fileSize,
                fileType: transferState.fileType,
                totalChunks: transferState.totalChunks
            });

            // Show progress
            document.getElementById('sendProgress').classList.add('show');
            
            // Save state
            saveTransferState();
            
            // Start sending chunks
            sendNextChunk(0);
            
            showNotification('Sending file...', 'success');
        }

        // Send Next Chunk
        async function sendNextChunk(chunkIndex) {
            if (!transferState.isTransferring || transferState.isPaused) {
                return;
            }

            if (!conn || !conn.open) {
                pauseTransfer();
                showNotification('Connection lost - transfer paused', 'warning');
                return;
            }

            const start = chunkIndex * CHUNK_SIZE;
            const end = Math.min(start + CHUNK_SIZE, transferState.fileSize);
            const chunk = transferState.fileData.slice(start, end);

            try {
                const arrayBuffer = await chunk.arrayBuffer();
                const base64 = arrayBufferToBase64(arrayBuffer);

                conn.send({
                    type: 'chunk',
                    fileId: transferState.fileId,
                    chunkIndex: chunkIndex,
                    data: base64,
                    totalChunks: transferState.totalChunks
                });

                transferState.sentBytes += (end - start);
                transferState.lastChunkIndex = chunkIndex;

                // Update progress
                updateSendProgress();

                // Save state every 10 chunks
                if (chunkIndex % 10 === 0) {
                    saveTransferState();
                }

                if (end < transferState.fileSize) {
                    // Continue sending
                    setTimeout(() => sendNextChunk(chunkIndex + 1), 10);
                } else {
                    // Transfer complete
                    conn.send({
                        type: 'complete',
                        fileId: transferState.fileId
                    });
                    
                    completeSending();
                }

            } catch (error) {
                console.error('Error sending chunk:', error);
                pauseTransfer();
                showNotification('Error sending chunk', 'error');
            }
        }

        // Handle Metadata
        function handleMetadata(metadata) {
            transferState = {
                fileId: metadata.fileId,
                fileName: metadata.fileName,
                fileSize: metadata.fileSize,
                fileType: metadata.fileType,
                direction: 'receive',
                sentBytes: 0,
                receivedBytes: 0,
                receivedChunks: new Map(),
                isTransferring: true,
                isPaused: false,
                lastChunkIndex: -1,
                totalChunks: metadata.totalChunks,
                startTime: Date.now(),
                fileData: null
            };

            document.getElementById('receiveStatus').innerHTML = 
                `<div class="status success">Receiving: ${metadata.fileName}</div>`;
            document.getElementById('receiveProgress').classList.add('show');

            saveTransferState();
            showNotification('Receiving file: ' + metadata.fileName, 'success');
        }

        // Handle Chunk
        function handleChunk(chunkData) {
            if (chunkData.fileId !== transferState.fileId) {
                console.warn('Chunk from different file');
                return;
            }

            try {
                const arrayBuffer = base64ToArrayBuffer(chunkData.data);
                transferState.receivedChunks.set(chunkData.chunkIndex, arrayBuffer);
                transferState.receivedBytes += arrayBuffer.byteLength;
                transferState.lastChunkIndex = Math.max(transferState.lastChunkIndex, chunkData.chunkIndex);

                // Update progress
                updateReceiveProgress();

                // Save state every 10 chunks
                if (chunkData.chunkIndex % 10 === 0) {
                    saveTransferState();
                }

            } catch (error) {
                console.error('Error handling chunk:', error);
            }
        }

        // Handle Transfer Complete
        function handleTransferComplete() {
            // Reconstruct file
            const chunks = [];
            for (let i = 0; i < transferState.totalChunks; i++) {
                const chunk = transferState.receivedChunks.get(i);
                if (!chunk) {
                    console.error('Missing chunk:', i);
                    showNotification('Transfer incomplete - missing chunks', 'error');
                    return;
                }
                chunks.push(chunk);
            }

            const blob = new Blob(chunks, { type: transferState.fileType });
            downloadFile(blob, transferState.fileName);

            showNotification('File received successfully!', 'success');
            resetTransferState();
        }

        function completeSending() {
            showNotification('File sent successfully!', 'success');
            resetTransferState();
        }

        // Pause Transfer
        function pauseTransfer() {
            if (!transferState.isTransferring) return;
            
            transferState.isPaused = true;
            saveTransferState();
            
            console.log('Transfer paused at chunk:', transferState.lastChunkIndex);
            showNotification('Transfer paused', 'warning');
        }

        // Show Resume Dialog
        function showResumeDialog() {
            const modal = document.getElementById('resumeModal');
            const message = document.getElementById('resumeMessage');
            const progress = document.getElementById('resumeProgress');

            const percent = transferState.direction === 'send'
                ? ((transferState.sentBytes / transferState.fileSize) * 100).toFixed(1)
                : ((transferState.receivedBytes / transferState.fileSize) * 100).toFixed(1);

            message.textContent = `Your previous ${transferState.direction === 'send' ? 'upload' : 'download'} of "${transferState.fileName}" was interrupted at ${percent}%. Would you like to resume?`;
            progress.textContent = percent + '%';

            modal.classList.add('show');
        }

        // Accept Resume
        function acceptResume() {
            document.getElementById('resumeModal').classList.remove('show');

            if (!conn || !conn.open) {
                showNotification('Not connected to peer', 'error');
                return;
            }

            transferState.isPaused = false;
            transferState.startTime = Date.now();

            if (transferState.direction === 'send') {
                // Request resume info from receiver
                conn.send({
                    type: 'request-resume',
                    fileId: transferState.fileId
                });
                
                showNotification('Requesting resume information...', 'success');
            } else {
                // Receiver ready - send current progress
                conn.send({
                    type: 'resume-info',
                    fileId: transferState.fileId,
                    lastChunkReceived: transferState.lastChunkIndex,
                    receivedBytes: transferState.receivedBytes
                });
                
                showNotification('Ready to resume receiving...', 'success');
            }
        }

        // Cancel Resume
        function cancelResume() {
            document.getElementById('resumeModal').classList.remove('show');
            
            if (conn && conn.open) {
                conn.send({
                    type: 'cancel',
                    fileId: transferState.fileId
                });
            }
            
            resetTransferState();
            showNotification('Transfer cancelled', 'warning');
        }

        // Handle Resume Request
        function handleResumeRequest() {
            if (transferState.fileId) {
                conn.send({
                    type: 'resume-info',
                    fileId: transferState.fileId,
                    lastChunkReceived: transferState.lastChunkIndex,
                    receivedBytes: transferState.receivedBytes
                });
            }
        }

        // Handle Resume Info
        function handleResumeInfo(data) {
            if (data.fileId === transferState.fileId) {
                transferState.lastChunkIndex = data.lastChunkReceived;
                transferState.sentBytes = data.receivedBytes;
                
                // Accept and continue
                conn.send({
                    type: 'resume-accepted',
                    fileId: transferState.fileId,
                    fromChunk: data.lastChunkReceived + 1
                });
                
                continueTransfer(data.lastChunkReceived + 1);
            }
        }

        // Continue Transfer
        function continueTransfer(fromChunk) {
            transferState.isPaused = false;
            
            if (transferState.direction === 'send') {
                // Show progress UI
                document.getElementById('sendProgress').classList.add('show');
                
                // Resume sending
                sendNextChunk(fromChunk);
                showNotification('Resuming upload...', 'success');
            } else {
                // Show progress UI
                document.getElementById('receiveProgress').classList.add('show');
                showNotification('Resuming download...', 'success');
            }
        }

        // Handle Transfer Cancelled
        function handleTransferCancelled() {
            resetTransferState();
            showNotification('Transfer cancelled by peer', 'warning');
        }

        // Reset Transfer State
        function resetTransferState() {
            transferState = {
                fileId: null,
                fileName: null,
                fileSize: 0,
                fileType: null,
                direction: null,
                sentBytes: 0,
                receivedBytes: 0,
                receivedChunks: new Map(),
                isTransferring: false,
                isPaused: false,
                lastChunkIndex: 0,
                totalChunks: 0,
                startTime: null,
                fileData: null
            };

            clearTransferState();

            document.getElementById('sendProgress').classList.remove('show');
            document.getElementById('receiveProgress').classList.remove('show');
            document.getElementById('fileInput').value = '';
            selectedFile = null;
        }

        // Update Progress
        function updateSendProgress() {
            const percent = ((transferState.sentBytes / transferState.fileSize) * 100).toFixed(1);
            const speed = calculateSpeed(transferState.sentBytes, transferState.startTime);

            document.getElementById('sendProgressFill').style.width = percent + '%';
            document.getElementById('sendProgressFill').textContent = percent + '%';
            document.getElementById('sendSpeed').textContent = formatSpeed(speed);
            document.getElementById('sendData').textContent = 
                `${formatBytes(transferState.sentBytes)} / ${formatBytes(transferState.fileSize)}`;
        }

        function updateReceiveProgress() {
            const percent = ((transferState.receivedBytes / transferState.fileSize) * 100).toFixed(1);
            const speed = calculateSpeed(transferState.receivedBytes, transferState.startTime);

            document.getElementById('receiveProgressFill').style.width = percent + '%';
            document.getElementById('receiveProgressFill').textContent = percent + '%';
            document.getElementById('receiveSpeed').textContent = formatSpeed(speed);
            document.getElementById('receiveData').textContent = 
                `${formatBytes(transferState.receivedBytes)} / ${formatBytes(transferState.fileSize)}`;
        }

        // State Persistence
        function saveTransferState() {
            const stateToSave = {
                ...transferState,
                receivedChunks: Array.from(transferState.receivedChunks.keys()),
                fileData: null // Don't save file object
            };

            localStorage.setItem('p2p_transfer_state', JSON.stringify(stateToSave));
        }

        function loadTransferState() {
            const saved = localStorage.getItem('p2p_transfer_state');
            if (!saved) return;

            try {
                const parsed = JSON.parse(saved);
                
                if (parsed.isTransferring) {
                    transferState = {
                        ...parsed,
                        receivedChunks: new Map(parsed.receivedChunks ? parsed.receivedChunks.map(i => [i, null]) : []),
                        isPaused: true,
                        fileData: null
                    };
                    
                    // If sending, need to re-select file
                    if (transferState.direction === 'send' && !transferState.fileData) {
                        console.log('Need to re-select file for sending');
                    }
                }
            } catch (error) {
                console.error('Failed to load transfer state:', error);
            }
        }

        function clearTransferState() {
            localStorage.removeItem('p2p_transfer_state');
        }

        // Utility Functions
        function calculateSpeed(bytes, startTime) {
            const duration = (Date.now() - startTime) / 1000;
            return duration > 0 ? bytes / duration : 0;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }

        function formatSpeed(bytesPerSecond) {
            return formatBytes(bytesPerSecond) + '/s';
        }

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function generateFileId() {
            return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            const binary = window.atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            const messageEl = document.getElementById('notificationMessage');

            notification.className = 'notification ' + type;
            messageEl.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            initSocket();
            initPeer();
            loadTransferState();
        });
    </script>
</body>
</html>
