 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>QR Send v5 – Auto-Resume + Persist (P2P)</title>

<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
/* --- UI kept compact; same look as v4 --- */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-primary:#fff;--bg-secondary:#f8f9fa;--bg-card:#fff;--text-primary:#1a1a1a;--text-secondary:#666;--accent:#4285f4;--accent-hover:#3367d6;--border:#e0e0e0;--shadow:rgba(0,0,0,.1);--success:#34a853;--error:#ea4335}
body.dark-mode{--bg-primary:#0f0f0f;--bg-secondary:#1a1a1a;--bg-card:#1e1e1e;--text-primary:#e8e8e8;--text-secondary:#b0b0b0;--border:#333;--shadow:rgba(255,255,255,.05)}
body{font-family:'Google Sans','Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,var(--bg-primary) 0%,var(--bg-secondary) 100%);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;transition:all .3s ease;position:relative;overflow-x:hidden}
.container{position:relative;max-width:450px;width:100%;background:var(--bg-card);border-radius:20px;box-shadow:0 10px 40px var(--shadow),0 0 0 1px var(--border);overflow:hidden;max-height:95vh;overflow-y:auto}
header{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-hover) 100%);padding:20px;text-align:center;color:#fff}
h1{font-size:22px;font-weight:600}
#status{font-size:13px;opacity:.95}
main{padding:20px}
#qrcode{display:inline-block;padding:15px;background:#fff;border-radius:12px;box-shadow:0 4px 16px var(--shadow);margin-bottom:15px}
#share-buttons-container{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.share-button{padding:10px 18px;border:2px solid var(--border);background:var(--bg-card);color:var(--text-primary);border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.share-button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.scanner-button{background:var(--success);color:#fff;border-color:var(--success)}
.transfer-area{padding:20px;background:var(--bg-secondary);border-top:1px solid var(--border)}
.progress-container{margin-top:15px;padding:15px;background:var(--bg-card);border-radius:10px;box-shadow:0 2px 8px var(--shadow);display:none}
.progress-bar-background{position:relative;width:100%;height:35px;background:var(--bg-secondary);border-radius:18px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent) 0%,var(--success) 100%);border-radius:18px;transition:width .3s ease}
.progress-stats{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-secondary)}
.switch-mode-button{margin-top:12px;width:100%;padding:12px;background:linear-gradient(135deg,#ffc107 0%,#ff9800 100%);border:none;border-radius:10px;font-weight:700}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px);z-index:10000}
.modal-content{background:var(--bg-card);padding:22px;border-radius:14px;max-width:420px;width:90%;text-align:center}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>QR Send v5 – Auto-Resume</h1>
    <div id="status">Starting…</div>
  </header>
  <main>
    <div id="qr-code-container" style="text-align:center">
      <div id="qrcode"></div>
      <p>Scan QR to connect securely</p>
      <div id="share-buttons-container">
        <button id="native-share-button" class="share-button" style="display:none">📤 Share</button>
        <button id="copy-link-button" class="share-button">📋 Copy</button>
        <button id="download-qr-button" class="share-button">💾 Save</button>
        <button id="scan-qr-button" class="share-button scanner-button" onclick="openScanner()">📷 Scan</button>
      </div>
    </div>
    <div id="scan-instructions" style="display:none;text-align:center"><p>✅ Connected Securely!</p></div>
  </main>
  <div class="transfer-area">
    <h3>📁 Send Files</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="file" id="file-input" disabled multiple />
      <button id="pick-with-handle" class="share-button" title="Use File System Access API if available">📂 Pick (Persistent)</button>
    </div>
    <div id="transfer-status" style="margin-top:8px;font-size:13px;color:var(--text-secondary)">Waiting…</div>

    <!-- Sending -->
    <div id="progress-container" class="progress-container">
      <div class="progress-label" style="display:flex;justify-content:space-between;font-size:13px;font-weight:600">
        <span id="progress-file-name">Sending…</span>
        <span id="progress-percentage">0%</span>
      </div>
      <div class="progress-bar-background"><div id="progress-bar" class="progress-bar" style="width:0%"></div></div>
      <div class="progress-stats">
        <span id="progress-size">0 / 0</span>
        <span id="progress-eta">ETA: --:--</span>
      </div>
      <button id="cancel-button" class="share-button" style="background:var(--error);color:#fff;border-color:var(--error);width:100%">❌ Cancel</button>
    </div>

    <!-- Receiving -->
    <div id="receive-progress-container" class="progress-container">
      <div class="progress-label" style="display:flex;justify-content:space-between;font-size:13px;font-weight:600">
        <span id="receive-progress-file-name">Receiving…</span>
        <span id="receive-progress-percentage">0%</span>
      </div>
      <div class="progress-bar-background"><div id="receive-progress-bar" class="progress-bar" style="width:0%"></div></div>
      <div class="progress-stats">
        <span id="receive-progress-size">0 / 0</span>
        <span>🔐 Encrypted</span>
      </div>
    </div>
  </div>
</div>

<!-- Resume Prompt -->
<div class="modal-backdrop" id="resume-modal">
  <div class="modal-content">
    <h3>Connection Interrupted</h3>
    <p>Paused file transfer for: <strong id="resume-file-name">filename</strong></p>
    <div style="display:flex;gap:10px">
      <button class="share-button" id="cancel-resume-btn">❌ Cancel</button>
      <button class="share-button" id="resume-btn" style="background:var(--success);color:#fff;border-color:var(--success)">🔄 Resume</button>
    </div>
  </div>
</div>

<!-- Scanner Modal -->
<div class="modal-backdrop" id="scanner-modal" style="background:rgba(0,0,0,.95)">
  <div class="modal-content" style="background:#000;color:#fff;max-width:none;width:100%;height:100%;border-radius:0;padding:0;display:flex;flex-direction:column">
    <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.8)">
      <h3 style="margin:0">📷 Scan QR Code</h3>
      <button class="share-button" onclick="closeScanner()" style="background:var(--error);color:#fff;border-color:var(--error)">✕</button>
    </div>
    <div id="qr-reader" style="flex:1"></div>
    <div style="padding:10px;text-align:center;color:#0f0">📱 Point camera at QR code</div>
  </div>
</div>

<script>
// ========= Utilities =========
const CHUNK_SIZE = 64 * 1024; // 64KB
let peer = null, currentConnection = null; let isHost = false, targetPeerId = null;
let reconnectInterval = null, heartbeatInterval = null, lastPongTime = 0, isConnectedOnce = false;
let NOTIFICATION_PERMISSION = 'default';

// Sender & Receiver in-memory state
const fileSendState = {}; // {fileId:{file, handle?, totalChunks, lastAckChunk, isSending, startTime}}
const fileReceiveState = {}; // {fileId:{metadata, chunks: Map(index->ArrayBuffer), totalChunks, isReceiving, completed}}

// Optional persistence
const supportsFS = 'showOpenFilePicker' in window;
let idbReady = false;
let idbDB = null;

function notify(title, options){ if (NOTIFICATION_PERMISSION==='granted') new Notification(title,{...options, silent:true, renotify:false}); }
function requestNotificationPermission(){ if('Notification' in window){ Notification.requestPermission().then(p=>NOTIFICATION_PERMISSION=p); } }

// IndexedDB minimal helper for receiver chunk persistence
const IDB_NAME = 'qr-send-v5';
const IDB_STORE = 'chunks';
function idbOpen(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e=>{ const db = req.result; if(!db.objectStoreNames.contains(IDB_STORE)){ db.createObjectStore(IDB_STORE, { keyPath:['fileId','index'] }); } };
    req.onsuccess = ()=>{ idbDB = req.result; idbReady = true; res(); };
    req.onerror = ()=>rej(req.error);
  });
}
async function idbPutChunk(fileId,index,data){ if(!idbReady) await idbOpen(); return new Promise((res,rej)=>{ const tx = idbDB.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put({fileId,index,data}); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbCountChunks(fileId){ if(!idbReady) await idbOpen(); return new Promise((res,rej)=>{ const tx = idbDB.transaction(IDB_STORE,'readonly'); const store = tx.objectStore(IDB_STORE); const range = IDBKeyRange.bound([fileId,0],[fileId,Infinity]); let count=0; const req = store.openKeyCursor(range); req.onsuccess = ()=>{ const cur = req.result; if(cur){ count++; cur.continue(); } else res(count); }; req.onerror=()=>rej(req.error); }); }
async function idbReadAll(fileId,total){ if(!idbReady) await idbOpen(); return new Promise((res,rej)=>{ const tx = idbDB.transaction(IDB_STORE,'readonly'); const store = tx.objectStore(IDB_STORE); const range = IDBKeyRange.bound([fileId,0],[fileId,Infinity]); const out = new Array(total).fill(null); const req = store.openCursor(range); req.onsuccess=()=>{ const cur=req.result; if(cur){ const {index,data} = cur.value; out[index] = data; cur.continue(); } else res(out); }; req.onerror=()=>rej(req.error); }); }
async function idbClearFile(fileId){ if(!idbReady) await idbOpen(); return new Promise((res,rej)=>{ const tx = idbDB.transaction(IDB_STORE,'readwrite'); const store = tx.objectStore(IDB_STORE); const range = IDBKeyRange.bound([fileId,0],[fileId,Infinity]); const req = store.openKeyCursor(range); req.onsuccess=()=>{ const cur=req.result; if(cur){ store.delete(cur.primaryKey); cur.continue(); } else res(); }; req.onerror=()=>rej(req.error); }); }

// ========= UI refs =========
const statusEl = document.getElementById('status');
const qrCodeContainer = document.getElementById('qr-code-container');
const qrEl = document.getElementById('qrcode');
const scanInstructions = document.getElementById('scan-instructions');
const fileInput = document.getElementById('file-input');
const pickWithHandleBtn = document.getElementById('pick-with-handle');
const transferStatusEl = document.getElementById('transfer-status');
const shareButtonsContainer = document.getElementById('share-buttons-container');
const copyLinkButton = document.getElementById('copy-link-button');
const downloadQrButton = document.getElementById('download-qr-button');
const nativeShareButton = document.getElementById('native-share-button');

// Send UI
const progressContainer = document.getElementById('progress-container');
const progressBar = document.getElementById('progress-bar');
const progressPercentage = document.getElementById('progress-percentage');
const progressSize = document.getElementById('progress-size');
const progressEta = document.getElementById('progress-eta');
const cancelButton = document.getElementById('cancel-button');
const progressFileName = document.getElementById('progress-file-name');

// Receive UI
const receiveProgressContainer = document.getElementById('receive-progress-container');
const receiveProgressBar = document.getElementById('receive-progress-bar');
const receiveProgressPercentage = document.getElementById('receive-progress-percentage');
const receiveProgressSize = document.getElementById('receive-progress-size');
const receiveProgressFileName = document.getElementById('receive-progress-file-name');

// Resume modal
const resumeModal = document.getElementById('resume-modal');
const resumeFileName = document.getElementById('resume-file-name');
const resumeBtn = document.getElementById('resume-btn');
const cancelResumeBtn = document.getElementById('cancel-resume-btn');

// ========= Theme =========
function toggleTheme(){ document.body.classList.toggle('dark-mode'); const isDark = document.body.classList.contains('dark-mode'); localStorage.setItem('theme', isDark?'dark':'light'); }
if(localStorage.getItem('theme')==='dark') toggleTheme();

// ========= QR Scanner =========
let html5QrCode=null, isScanning=false, hasScanned=false, ALLOW_PEER_INIT=true, IS_RELOADING=false;
function openScanner(){ if(isScanning||document.getElementById('scanner-modal').style.display==='flex') return; hasScanned=false; ALLOW_PEER_INIT=false; document.getElementById('scanner-modal').style.display='flex'; startScanner(); }
function closeScanner(){ document.getElementById('scanner-modal').style.display='none'; stopScanner(); if(!hasScanned && !IS_RELOADING){ ALLOW_PEER_INIT=true; } }
function startScanner(){ if(html5QrCode||isScanning) return; isScanning=true; html5QrCode=new Html5Qrcode('qr-reader'); const cfg={ fps:30, qrbox:(w,h)=>{ const m=Math.min(w,h); return {width:Math.floor(0.8*m), height:Math.floor(0.8*m)}}, aspectRatio:1, disableFlip:false };
  html5QrCode.start({facingMode:'environment'}, cfg, (decoded)=>{ if(hasScanned) return; hasScanned=true; if(navigator.vibrate) navigator.vibrate(150); setTimeout(()=>{ processQRCode(decoded); closeScanner(); },0); }, ()=>{})
  .catch(()=>{ isScanning=false; ALLOW_PEER_INIT=true; alert('Could not start camera.'); closeScanner(); }); }
function stopScanner(){ if(html5QrCode&&isScanning){ html5QrCode.stop().then(()=>{ html5QrCode.clear(); html5QrCode=null; isScanning=false; }).catch(()=>{ html5QrCode=null; isScanning=false; }); } }
function processQRCode(text){ if(IS_RELOADING) return; IS_RELOADING=true; try{ const url=new URL(text); const scannedPeerId=url.hash.substring(1); if(!scannedPeerId){ alert('QR has no peer ID'); hasScanned=false; ALLOW_PEER_INIT=true; IS_RELOADING=false; return;} window.location.hash=scannedPeerId; window.location.reload(); }catch(e){ alert('Invalid QR code: '+e.message); hasScanned=false; ALLOW_PEER_INIT=true; IS_RELOADING=false; } }

// ========= Peer / Connection =========
function initializePeer(){ if(!ALLOW_PEER_INIT) return; statusEl.textContent='Initializing…'; const peerOptions={ host:'my-qr-signal.onrender.com', port:443, secure:true, path:'/peerjs', debug:1,
  config:{ iceServers:[ {urls:'stun:stun.l.google.com:19302'}, {urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject'}], sdpSemantics:'unified-plan' } };
  try{ peer=new Peer(peerOptions); }catch(e){ statusEl.textContent='❌ Error'; return; }
  peer.on('open', id=>{ const hashId=window.location.hash.substring(1); if(hashId){ isHost=false; targetPeerId=hashId; statusEl.textContent='🔗 Connecting…'; qrCodeContainer.style.display='none'; shareButtonsContainer.style.display='none'; scanInstructions.style.display='none'; attemptConnection(targetPeerId,false); }
    else{ isHost=true; statusEl.textContent='Generating QR…'; const url=`${window.location.origin}${window.location.pathname}#${id}`; new QRCode(qrEl,{text:url,width:256,height:256,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H}); shareButtonsContainer.style.display='flex'; setupShareButton(url); statusEl.textContent='✅ Ready'; }
  });
  peer.on('connection', conn=>{ if(currentConnection && currentConnection.peer===conn.peer){ currentConnection.close(); currentConnection=null; } if(currentConnection && currentConnection.open){ conn.close(); return; } setupConnection(conn,false); });
  peer.on('error', err=>{ if(['server-error','socket-error','network'].includes(err.type)){ statusEl.textContent='⚠️ Connection Lost… Reconnecting…'; handleDisconnect('Server Error'); } else if(err.type==='peer-unavailable' && !isHost){ statusEl.textContent='❌ Peer not found'; showSwitchButton(); } });
}

function attemptConnection(targetId,isReconnect){ if(currentConnection&&currentConnection.open) return; const conn=peer.connect(targetId,{reliable:true,serialization:'binary'});
  conn.on('open',()=>setupConnection(conn,isReconnect));
  conn.on('error',()=>{ if(!isReconnect) showSwitchButton(); });
  conn.on('close',()=>handleDisconnect('Closed'));
}

function setupConnection(conn,isReconnect){ if(currentConnection && currentConnection.peer!==conn.peer) currentConnection.close();
  currentConnection=conn; stopReconnectInterval(); isConnectedOnce=true;
  statusEl.textContent='🔐 Connected!'; fileInput.disabled=false; transferStatusEl.textContent='✅ Ready';
  qrCodeContainer.style.display='none'; shareButtonsContainer.style.display='none'; scanInstructions.style.display='block';
  startHeartbeat();
  if(isReconnect){ conn.send({ type:'negotiate_resume', sendState:getSendStateSummary(), receiveState:getReceiveStateSummary() }); }
  else{
    // Proactive negotiation if we already have state
    if(Object.keys(fileSendState).length || Object.keys(fileReceiveState).length){
      conn.send({ type:'negotiate_resume', sendState:getSendStateSummary(), receiveState:getReceiveStateSummary() });
    }
  }

  conn.on('data', onConnData);
  conn.on('close',()=>handleDisconnect('Closed'));
  conn.on('error',err=>handleDisconnect('Error: '+err.type));
}

function onConnData(data){
  if(data.type==='heartbeat-ping'){ currentConnection.send({type:'heartbeat-pong'}); return; }
  if(data.type==='heartbeat-pong'){ lastPongTime=Date.now(); return; }
  switch(data.type){
    case 'metadata':{
      const {name,size,type,fileId} = data.metadata;
      const totalChunks = Math.max(1, Math.ceil(size/CHUNK_SIZE));
      fileReceiveState[fileId] = { metadata:{name,size,type,fileId}, chunks:new Map(), totalChunks, isReceiving:true, completed:false };
      receiveProgressFileName.textContent = `Receiving: ${name}`;
      receiveProgressContainer.style.display='block';
      updateReceiveProgress(name,0,size,0);
      currentConnection.send({ type:'ack_metadata', fileId, nextChunk: 0 });
      break;
    }
    case 'chunk':{
      const {fileId,index,chunk} = data; const state = fileReceiveState[fileId]; if(!state||state.completed) return;
      if(state.chunks.has(index)){ currentConnection.send({type:'ack_chunk', fileId, nextChunk: state.chunks.size}); return; }
      state.chunks.set(index, chunk);
      // Persist chunk to IDB (best-effort)
      idbPutChunk(fileId, index, chunk).catch(()=>{});

      let receivedBytes=0; state.chunks.forEach(c=>receivedBytes+=c.byteLength);
      const totalSize = state.metadata.size; const percent = Math.round((state.chunks.size/state.totalChunks)*100);
      updateReceiveProgress(state.metadata.name, Math.min(receivedBytes,totalSize), totalSize, percent);
      if(state.chunks.size===state.totalChunks){ state.completed=true; assembleAndDownload(state).catch(()=>{}); transferStatusEl.textContent='✅ Received!'; }
      else currentConnection.send({ type:'ack_chunk', fileId, nextChunk: state.chunks.size });
      break;
    }
    case 'ack_metadata':{
      const {fileId,nextChunk} = data; const state = fileSendState[fileId]; if(!state) return;
      state.isSending=true; state.lastAckChunk = nextChunk-1; if(!state.startTime) state.startTime=Date.now();
      readAndSendSlice(state, nextChunk);
      break;
    }
    case 'ack_chunk':{
      const {fileId,nextChunk} = data; const state = fileSendState[fileId]; if(!(state&&state.isSending)) return;
      state.lastAckChunk = nextChunk-1; const sentBytes = nextChunk*CHUNK_SIZE; updateSendProgress(state.file.name, Math.min(sentBytes, state.file.size), state.file.size, state);
      if(nextChunk < state.totalChunks) readAndSendSlice(state, nextChunk);
      else { currentConnection.send({type:'end', fileId}); progressContainer.style.display='none'; delete fileSendState[fileId]; transferStatusEl.textContent='✅ Sent!'; sendNextFileFromQueue(); }
      break;
    }
    case 'end':{
      const {fileId} = data; const state = fileReceiveState[fileId]; if(state && !state.completed){ state.completed=true; assembleAndDownload(state).catch(()=>{}); }
      break;
    }
    case 'cancel':{
      const {fileId} = data;
      if(fileSendState[fileId]){ fileSendState[fileId].isSending=false; delete fileSendState[fileId]; progressContainer.style.display='none'; transferStatusEl.textContent='❌ Cancelled by receiver'; }
      if(fileReceiveState[fileId]){ fileReceiveState[fileId].isReceiving=false; delete fileReceiveState[fileId]; receiveProgressContainer.style.display='none'; transferStatusEl.textContent='❌ Cancelled by sender'; }
      break;
    }
    case 'negotiate_resume':{
      if(isHost){ // Receiver side
        for(const fileId in data.sendState){
          const local = fileReceiveState[fileId]; const remote = data.sendState[fileId];
          if(local && local.isReceiving){
            // Show paused UI and immediately instruct sender where to resume
            receiveProgressContainer.style.display='block'; let receivedBytes=0; local.chunks.forEach(c=>receivedBytes+=c.byteLength);
            const totalSize=local.metadata.size; const percent=Math.round((local.chunks.size/local.totalChunks)*100);
            updateReceiveProgress(local.metadata.name, Math.min(receivedBytes,totalSize), totalSize, percent);
            receiveProgressFileName.textContent = `Paused: ${local.metadata.name}`; transferStatusEl.textContent='Resuming...';
            currentConnection.send({ type:'ack_metadata', fileId, nextChunk: local.chunks.size });
          } else if(!local && remote){
            const metadata = { name: remote.name, size: remote.size, type: remote.type, fileId };
            fileReceiveState[fileId] = { metadata, chunks:new Map(), totalChunks: remote.totalChunks, isReceiving:true, completed:false };
            receiveProgressContainer.style.display='block'; updateReceiveProgress(metadata.name, 0, metadata.size, 0);
            currentConnection.send({ type:'ack_metadata', fileId, nextChunk: 0 });
          }
        }
      } else { // Sender side
        for(const fileId in data.receiveState){
          const local = fileSendState[fileId]; const remoteNextChunk = data.receiveState[fileId].nextChunk;
          if(local && !local.isSending){
            // Auto-resume (no prompt). If you want prompt, call showResumePrompt instead.
            local.isSending = true; progressContainer.style.display='block';
            updateSendProgress(local.file.name, Math.min(remoteNextChunk*CHUNK_SIZE, local.file.size), local.file.size, local);
            currentConnection.send({ type:'ack_metadata', fileId, nextChunk: remoteNextChunk });
          }
        }
      }
      break;
    }
    case 'cancel_resume':{
      const {fileId} = data; if(fileSendState[fileId]) delete fileSendState[fileId]; if(fileReceiveState[fileId]) delete fileReceiveState[fileId];
      progressContainer.style.display='none'; receiveProgressContainer.style.display='none'; resumeModal.style.display='none'; transferStatusEl.textContent='Waiting…';
      break;
    }
  }
}

// ========= Heartbeat / Reconnect =========
function startHeartbeat(){ stopHeartbeat(); lastPongTime=Date.now(); heartbeatInterval = setInterval(()=>{
  if(!currentConnection || !currentConnection.open){ handleDisconnect('Heartbeat: lost'); return; }
  if(Date.now()-lastPongTime > 15000){ handleDisconnect('Heartbeat timeout'); return; }
  try{ currentConnection.send({type:'heartbeat-ping'}); }catch(e){ handleDisconnect('Heartbeat send fail'); }
}, 5000); }
function stopHeartbeat(){ if(heartbeatInterval){ clearInterval(heartbeatInterval); heartbeatInterval=null; } }
function startReconnectInterval(){ if(reconnectInterval || isHost) return; statusEl.textContent='⚠️ Connection Lost… Reconnecting…';
  reconnectInterval = setInterval(()=>{ if(currentConnection && currentConnection.open){ clearInterval(reconnectInterval); reconnectInterval=null; return; }
    if(peer && peer.disconnected) peer.reconnect(); if(targetPeerId) attemptConnection(targetPeerId,true); }, 5000);
}
function stopReconnectInterval(){ if(reconnectInterval){ clearInterval(reconnectInterval); reconnectInterval=null; } }
function handleDisconnect(msg){ stopHeartbeat(); stopReconnectInterval(); if(currentConnection){ try{currentConnection.close();}catch{} currentConnection=null; }
  progressContainer.style.display='none'; receiveProgressContainer.style.display='none';
  Object.values(fileSendState).forEach(s=>s.isSending=false); // paused
  Object.values(fileReceiveState).forEach(s=>s.isReceiving=true); // keep receive state
  if(!isHost && targetPeerId){ statusEl.textContent='⚠️ Connection Lost… Reconnecting…'; startReconnectInterval(); }
  else if(isHost){ statusEl.textContent='⚠️ Client Disconnected. Waiting…'; }
}

// ========= Send logic =========
fileInput.addEventListener('change', e=>{ const files = Array.from(e.target.files); e.target.value=null; enqueueFiles(files); sendNextFileFromQueue(); });

pickWithHandleBtn.addEventListener('click', async ()=>{
  if(!supportsFS){ alert('File System Access API not supported on this browser. Use file input.'); return; }
  try{
    const handles = await window.showOpenFilePicker({ multiple:true });
    const files = await Promise.all(handles.map(h=>h.getFile().then(f=>{ f.__handle=h; return f; })));
    enqueueFiles(files);
    sendNextFileFromQueue();
  }catch(e){ /* user cancelled */ }
});

function enqueueFiles(files){
  for(const file of files){ const fileId = `${file.name}-${file.size}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    fileSendState[fileId] = { file, handle: file.__handle, fileId, totalChunks: Math.max(1,Math.ceil(file.size/CHUNK_SIZE)), lastAckChunk:-1, isSending:false, startTime:Date.now() };
  }
  transferStatusEl.textContent = `📁 ${Object.keys(fileSendState).length} file(s) queued`;
}

function sendNextFileFromQueue(){ if(!currentConnection || !currentConnection.open) return;
  // Do not start a new file if paused/in-progress exists
  const hasPaused = Object.values(fileSendState).some(s=>s.lastAckChunk>=0 && !s.isSending);
  if(hasPaused){ console.log('Paused transfers pending; waiting for resume.'); return; }
  const entry = Object.entries(fileSendState).find(([id,s])=>s.lastAckChunk===-1); if(!entry) return;
  const [fileId,state] = entry; transferStatusEl.textContent = `📤 ${state.file.name}`; progressContainer.style.display='block'; updateSendProgress(state.file.name, 0, state.file.size, state);
  currentConnection.send({ type:'metadata', metadata:{ name:state.file.name, size:state.file.size, type:state.file.type, fileId:state.fileId } });
}

async function readAndSendSlice(state, chunkIndex){ if(!state.isSending || !currentConnection || !currentConnection.open){ state.isSending=false; return; }
  let file = state.file;
  // If we had a persistent handle and page reloaded, refresh the File object
  if(!file && state.handle){ try{ const perm = await state.handle.requestPermission({mode:'read'}); if(perm==='granted') file = await state.handle.getFile(); state.file = file; }catch{} }
  if(!file){ // cannot resume without file; prompt quietly
    transferStatusEl.textContent = '⚠️ Please re-pick the file to resume.'; return;
  }
  const offset = chunkIndex * CHUNK_SIZE;
  if(file.size===0 && chunkIndex===0){ currentConnection.send({type:'end', fileId: state.fileId}); progressContainer.style.display='none'; delete fileSendState[state.fileId]; transferStatusEl.textContent='✅ Sent!'; sendNextFileFromQueue(); return; }
  if(offset >= file.size && file.size>0){ currentConnection.send({type:'end', fileId: state.fileId}); progressContainer.style.display='none'; delete fileSendState[state.fileId]; transferStatusEl.textContent='✅ Sent!'; sendNextFileFromQueue(); return; }
  const slice = file.slice(offset, offset+CHUNK_SIZE); const reader = new FileReader();
  reader.onload = ev=>{ if(!state.isSending || !currentConnection || !currentConnection.open) return; try{ currentConnection.send({ type:'chunk', fileId: state.fileId, index: chunkIndex, chunk: ev.target.result }); }catch{ handleDisconnect('Send Error'); } };
  reader.onerror = ()=>{ state.isSending=false; };
  reader.readAsArrayBuffer(slice);
}

// ========= Progress UI =========
function updateSendProgress(name, sentBytes, totalBytes, stateRef){ const percent = totalBytes? Math.round((sentBytes/totalBytes)*100) : 0;
  progressFileName.textContent = `Sending: ${name}`; progressBar.style.width = `${percent}%`; progressPercentage.textContent = `${percent}%`; progressSize.textContent = `${formatBytes(sentBytes)} / ${formatBytes(totalBytes)}`;
  if(stateRef){ const elapsed = (Date.now()-stateRef.startTime)/1000; if(elapsed>0.5 && sentBytes>0){ const speed = sentBytes/elapsed; const remain = totalBytes-sentBytes; const eta = remain/speed; progressEta.textContent = `ETA: ${formatTime(eta)}`; } else progressEta.textContent = 'ETA: --:--'; }
  if(percent%10===0||percent===100) notify('Uploading…',{ body:`${name} (${percent}%)` });
}
function updateReceiveProgress(name, receivedBytes, totalBytes, percent){ receiveProgressFileName.textContent = `Receiving: ${name}`; receiveProgressBar.style.width = `${percent}%`; receiveProgressPercentage.textContent = `${percent}%`; receiveProgressSize.textContent = `${formatBytes(receivedBytes)} / ${formatBytes(totalBytes)}`; if(percent%10===0||percent===100) notify('Downloading…',{ body:`${name} (${percent}%)` }); }
function formatBytes(bytes,dec=2){ if(bytes===0) return '0 B'; const k=1024; const sizes=['B','KB','MB','GB','TB']; const i=Math.floor(Math.log(bytes)/Math.log(k)); return parseFloat((bytes/Math.pow(k,i)).toFixed(dec))+' '+sizes[i]; }
function formatTime(s){ if(!isFinite(s)||s<0) return '--:--'; const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }

cancelButton.addEventListener('click',()=>{ const entry = Object.entries(fileSendState).find(([id,s])=>s.isSending); if(!entry) return; const [fileId,state]=entry; state.isSending=false; if(currentConnection&&currentConnection.open) currentConnection.send({type:'cancel', fileId: state.fileId}); delete fileSendState[state.fileId]; progressContainer.style.display='none'; transferStatusEl.textContent='❌ Transfer Cancelled'; notify('Upload Cancelled',{ body:'Transfer cancelled.'}); });

// ========= Assemble & download (uses IDB) =========
async function assembleAndDownload(state){ try{
  state.isReceiving=false; const {fileId,name,type,size} = { fileId: state.metadata.fileId, name: state.metadata.name, type: state.metadata.type||'application/octet-stream', size: state.metadata.size };
  // Fill any missing in-memory chunks from IDB
  const total = state.totalChunks; const fromIDB = await idbReadAll(fileId,total);
  const ordered = new Array(total);
  for(let i=0;i<total;i++) ordered[i] = state.chunks.get(i) || fromIDB[i];
  // If still missing, abort gracefully
  for(let i=0;i<total;i++) if(!ordered[i]){ transferStatusEl.textContent='❌ Error: Missing chunks'; return; }
  const blob = new Blob(ordered, {type}); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 100);
  receiveProgressContainer.style.display='none';
  // Cleanup persisted chunks for this file
  idbClearFile(fileId).catch(()=>{});
  notify('Download Complete',{ body:name });
  delete fileReceiveState[fileId];
  }catch(e){ transferStatusEl.textContent='❌ Assemble failed'; }
}

// ========= Share / Copy QR =========
function setupShareButton(url){ const canvas = qrEl.querySelector('canvas'); if(!canvas || typeof navigator.share==='undefined'){ nativeShareButton.style.display='none'; copyLinkButton.onclick=()=>copyToClipboard(url,copyLinkButton); downloadQrButton.onclick=()=>downloadQRCode(canvas); return; }
  canvas.toBlob(blob=>{ if(!blob) return; const file = new File([blob],'qr-code.png',{type:'image/png'}); const shareData = { title:'QR Send', text:'Scan to connect', url, files:[file] };
    if(navigator.canShare && navigator.canShare(shareData)){ nativeShareButton.style.display='inline-flex'; copyLinkButton.style.display='none'; downloadQrButton.style.display='none'; nativeShareButton.onclick=async()=>{ try{ await navigator.share(shareData);}catch{} } }
    else { nativeShareButton.style.display='none'; copyLinkButton.onclick=()=>copyToClipboard(url,copyLinkButton); downloadQrButton.onclick=()=>downloadQRCode(canvas); }
  }, 'image/png');
}
function copyToClipboard(text,el){ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>{ if(el){ const s=el.textContent; el.textContent='✅ Copied!'; setTimeout(()=>el.textContent=s,1500); } }); return; }
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); if(el){ const s=el.textContent; el.textContent='✅ Copied!'; setTimeout(()=>el.textContent=s,1500);} }catch{} document.body.removeChild(ta);
}
function downloadQRCode(canvas){ try{ if(canvas){ const dataUrl=canvas.toDataURL('image/png'); const a=document.createElement('a'); a.href=dataUrl; a.download='qr-send.png'; document.body.appendChild(a); a.click(); a.remove(); } }catch{}
}

// ========= Boot =========
requestNotificationPermission();
window.addEventListener('beforeunload', (e)=>{ const activeSend = Object.values(fileSendState).some(s=>s.isSending); const activeRecv = Object.values(fileReceiveState).some(s=>s.isReceiving); if(activeSend||activeRecv){ const w='File transfer active! Are you sure you want to leave?'; e.preventDefault(); e.returnValue=w; return w; } });

function showSwitchButton(){ if(document.getElementById('switch-mode-btn')||isConnectedOnce) return; const btn=document.createElement('button'); btn.id='switch-mode-btn'; btn.textContent='🔄 Go to Host Mode'; btn.className='switch-mode-button'; btn.onclick=()=>{ btn.remove(); window.location.hash=''; window.location.reload(); }; document.querySelector('.transfer-area').appendChild(btn); }

initializePeer();

</script>
