 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>QR Send - E2E Encrypted</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f1f1;
            --bg-card: #ffffff;
            --bg-chat-input: #f0f2f5;
            --bg-chat-main: #e5ddd5;
            --bg-chat-bubble-sender: #dcf8c6;
            --bg-chat-bubble-receiver: #ffffff;
            --bg-chat-bubble-sender-dark: #056162;
            --bg-chat-bubble-receiver-dark: #2a2a2a;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #a0a0a0;
            --text-chat-bubble: #303030;
            --text-chat-bubble-dark: #e8e8e8;
            --accent: #4285f4;
            --accent-hover: #3367d6;
            --accent-green-light: #075e54;
            --accent-green-dark: #128c7e;
            --border: #e0e0e0;
            --border-dark: #333333;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-dark: rgba(255, 255, 255, 0.05);
            --success: #34a853;
            --error: #ea4335;
            --read-receipt: #4fc3f7;
            --progress-bar-bg: rgba(0, 0, 0, 0.1);
            --progress-bar-bg-dark: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #131313;
            --bg-card: #1e1e1e;
            --bg-chat-input: #2a2a2a;
            --bg-chat-main: #0b141a;
            --bg-chat-bubble-sender: var(--bg-chat-bubble-sender-dark);
            --bg-chat-bubble-receiver: var(--bg-chat-bubble-receiver-dark);
            --text-primary: #e8e8e8;
            --text-secondary: #b0b0b0;
            --text-tertiary: #6a6a6a;
            --text-chat-bubble: var(--text-chat-bubble-dark);
            --border: var(--border-dark);
            --shadow: var(--shadow-dark);
            --progress-bar-bg: var(--progress-bar-bg-dark);
        }

        body {
            font-family: 'Google Sans', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .theme-toggle:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            fill: var(--text-primary);
            transition: all 0.3s ease;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: var(--bg-secondary);
            overflow: hidden;
            display: flex;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .sidebar {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .chat-main {
            display: none; /* Hidden on mobile by default */
        }

        header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        #status {
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
        }

        .connection-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        .connection-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lock-animation {
            position: relative;
            animation: lockBounce 1s ease-in-out;
        }

        @keyframes lockBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .lock-svg {
            width: 100px;
            height: 100px;
        }

        .lock-body {
            animation: lockClose 0.8s ease forwards;
        }

        @keyframes lockClose {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .lock-shackle {
            animation: shackleClose 0.8s ease forwards 0.3s;
        }

        @keyframes shackleClose {
            0% { transform: translateY(-10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .checkmark {
            animation: checkmarkDraw 0.5s ease forwards 1s;
        }

        @keyframes checkmarkDraw {
            0% { stroke-dashoffset: 100; opacity: 0; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }

        main {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        /* Hide scrollbar for main in mobile */
        main::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        #qr-code-container {
            text-align: center;
        }

        #qrcode {
            display: inline-block;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px var(--shadow);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        #qrcode:hover {
            transform: scale(1.03);
        }

        #qrcode canvas,
        #qrcode img {
            max-width: 100%;
            height: auto !important;
            width: auto !important;
        }

        #qr-code-container p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 12px;
        }

        #share-buttons-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .share-button {
            padding: 10px 18px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .share-button:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }

        .primary-share {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .scanner-button {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .scanner-button:hover {
            background: #2d8e47;
            border-color: #2d8e47;
        }

        .scanner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: none;
            flex-direction: column;
            z-index: 10000;
            padding: 0;
        }

        .scanner-modal.active {
            display: flex;
        }

        .scanner-header {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10001;
        }

        .scanner-header h2 {
            font-size: 18px;
            color: white;
            font-weight: 600;
        }

        .close-scanner {
            background: var(--error);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .close-scanner:hover {
            background: #c82333;
            transform: scale(1.1);
        }

        #qr-reader {
            width: 100% !important;
            height: calc(100vh - 70px) !important;
            position: relative;
            background: #000;
        }

        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }

        #qr-reader__dashboard,
        #qr-reader__dashboard_section {
            display: none !important;
        }

        #qr-reader__scan_region {
            width: 100% !important;
            height: 100% !important;
            position: relative !important;
            border: none !important;
        }

        .scan-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 350px;
            height: 80%;
            max-height: 350px;
            border: 3px solid var(--success);
            border-radius: 20px;
            z-index: 10000;
            pointer-events: none;
            box-shadow: 
                0 0 0 2000px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(52, 168, 83, 0.3);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--success), transparent);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .scan-corners {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid var(--success);
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 20px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 20px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 20px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 20px 0;
        }

        .scan-instruction {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            z-index: 10001;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        #scan-instructions {
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #scan-instructions p {
            font-size: 16px;
            color: var(--success);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #scan-instructions p::before {
            content: '🔒';
            font-size: 20px;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .transfer-area {
            padding: 20px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .transfer-area h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        #file-input {
            width: 100%;
            padding: 12px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 13px;
        }

        #file-input:hover {
            border-color: var(--accent);
            background: var(--accent);
            color: white;
        }

        #transfer-status {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* --- NEW TRANSFER LIST --- */
        #transfer-list-container {
            margin-top: 15px;
            max-height: 110px; /* 2.5 * (bar + margin) */
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px; /* for scrollbar */
        }
        
        #transfer-list-container::-webkit-scrollbar {
            width: 6px;
        }

        #transfer-list-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 3px;
        }

        #transfer-list-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        .progress-container {
            width: 100%;
            background: var(--bg-card);
            border-radius: 10px;
            box-shadow: 0 2px 8px var(--shadow);
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 8px;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .progress-bar-background {
            position: relative;
            flex-grow: 1;
            height: 10px;
            background: var(--progress-bar-bg);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px var(--shadow);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--success) 100%);
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        
        .progress-bar.pending {
            background: var(--text-tertiary);
        }

        .progress-info {
            flex-shrink: 0;
            font-size: 11px;
            color: var(--text-secondary);
            text-align: left;
            width: 100%;
        }

        .file-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%; /* prevent overflow */
            display: block;
            margin-bottom: 2px;
        }
        
        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-secondary);
        }

        .cancel-transfer-btn {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: var(--error);
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cancel-transfer-btn:hover {
            background: #d33828;
            transform: scale(1.1);
        }

        .switch-mode-button {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .switch-mode-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
        }
        
        /* --- CHAT STYLES --- */
        .chat-main {
            flex-grow: 1;
            height: 100%;
            background: var(--bg-chat-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            padding: 15px 20px;
            background: var(--bg-tertiary);
            border-left: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .peer-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .peer-info #peer-status {
            font-size: 12px;
            color: var(--success);
            font-weight: 500;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        
        body.dark-mode .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-chat-bubble);
            position: relative;
            word-wrap: break-word;
            animation: slideUp 0.3s ease;
        }
        
        .message-bubble.sender {
            background: var(--bg-chat-bubble-sender);
            align-self: flex-end;
            border-radius: 18px 18px 5px 18px;
        }
        
        .message-bubble.receiver {
            background: var(--bg-chat-bubble-receiver);
            align-self: flex-start;
            border-radius: 18px 18px 18px 5px;
        }
        
        body.dark-mode .message-bubble {
            color: var(--text-chat-bubble-dark);
        }
        
        /* Message metadata (timestamp, ticks) */
        .message-meta {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 5px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 3px;
        }
        
        .message-bubble.sender .message-meta {
            color: var(--text-tertiary);
        }
        
        .message-bubble.receiver .message-meta {
            color: var(--text-tertiary);
        }
        
        .read-receipt {
            font-weight: bold;
            font-size: 14px;
        }
        
        .read-receipt.sent {
            color: var(--text-tertiary);
        }
        
        .read-receipt.read {
            color: var(--read-receipt);
        }

        /* Image messages */
        .message-image {
            max-width: 250px;
            max-height: 250px;
            width: 100%;
            height: auto;
            border-radius: 15px;
            cursor: pointer;
            display: block;
        }
        
        .image-download-status {
            font-size: 10px;
            font-style: italic;
            color: var(--text-tertiary);
            margin-top: 4px;
            text-align: right;
        }
        
        /* Chat Input Area */
        .chat-input-area {
            padding: 15px 20px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        #chat-message-input {
            flex-grow: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: var(--bg-chat-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        
        body.dark-mode #chat-message-input {
            background: var(--bg-chat-input);
        }

        .chat-send-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-send-button:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }
        
        .chat-send-button.image-upload {
            background: var(--success);
        }
        
        .chat-send-button.image-upload:hover {
            background: #2d8e47;
        }
        
        #image-upload-input {
            display: none;
        }

        #chat-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
        }
        
        #chat-placeholder svg {
            width: 100px;
            height: 100px;
            opacity: 0.1;
            margin-bottom: 20px;
        }
        
        #chat-placeholder h2 {
            font-size: 22px;
            font-weight: 300;
        }
        
        #chat-placeholder p {
            font-size: 14px;
            margin-top: 10px;
        }


        /* --- DESKTOP LAYOUT --- */
        @media (min-width: 768px) {
            body {
                padding: 20px;
                background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            }
            
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle, var(--accent) 1px, transparent 1px);
                background-size: 50px 50px;
                opacity: 0.03;
                animation: bgMove 20s linear infinite;
                z-index: 0;
            }

            @keyframes bgMove {
